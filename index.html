  // ================= разбор текста Кинопоиска =================
  function parseKP(txt){
    const lines = txt.split(/\r?\n/).map(l => l.replace(/[ \t ]+/g, " ").trim()).filter(Boolean), out = {};
    const LBL = {"год производства":"year","страна":"country","жанр":"genre","слоган":"tagline","режиссер":"director","режиссёр":"director","сценарий":"writer","продюсер":"producer",
      "оператор":"operator","композитор":"composer","бюджет":"budget","сборы в мире":"boxWorld","премьера в мире":"premiereWorld","премьера в россии":"premiereRu","время":"duration","возраст":"age"};
    const KEYS = Object.keys(LBL).sort((a,b) => b.length - a.length);
    const IGN = ["художник","монтаж","сборы в сша","сборы в россии","цифровой релиз","рейтинг mpaa","о фильме","о сериале","в главных ролях","роли дублировали","сиквелы","трейлер","добавить в папку","буду смотреть","оценить","рейтинг фильма","в списках","обзор","нашли ошибку","добавить инфо"];
    const labelOf = l => { const low = l.toLowerCase(); for (const k of KEYS) if (low === k || low.startsWith(k + " ") || low.startsWith(k + ":")) return [k, l.slice(k.length).replace(/^[:\s]+/, "")]; return null; };
    const isIgn = l => { const low = l.toLowerCase(); return IGN.some(k => low.startsWith(k)); };
    const clean = (v, key) => {
      v = v.replace(/,?\s*(\.\.\.|…)\s*$/, "").replace(/\s+слова$/i, "").replace(/\s+сборы$/i, "").trim();
      if (key === "boxWorld" && v.includes("=")) v = v.split("=").pop().trim();
      if (key === "premiereWorld" || key === "premiereRu") v = v.split(/,\s*[«"]/)[0].replace(/,\s*$/, "").trim();
      if (key === "year"){ const m = v.match(/\d{4}/); v = m ? +m[0] : null; }
      if (key === "tagline") v = v.replace(/^[«"]|[»"]$/g, "");
      return v;
    };
    let firstLabel = lines.length;
    lines.forEach((l, i) => { const m = labelOf(l); if (!m) return; firstLabel = Math.min(firstLabel, i);
      let v = m[1]; if (!v && lines[i+1] && !labelOf(lines[i+1]) && !isIgn(lines[i+1])) v = lines[i+1];
      if (v && out[LBL[m[0]]] == null){ const c = clean(v, LBL[m[0]]); if (c) out[LBL[m[0]]] = c; } });
    const head = lines.slice(0, Math.min(firstLabel, 12)).filter(l => !isIgn(l));
    if (head[0]){ const m = head[0].match(/^(.+?)\s*\((\d{4})(?:\s*[–-]\s*(?:\d{4}|\.\.\.))?\)\s*$/); out.title = m ? m[1] : head[0]; if (m && !out.year) out.year = +m[2]; }
    if (head[1]){ const am = head[1].match(/^(.*?)\s*(\d{1,2}\+)\s*$/), name = am ? am[1] : head[1];
      if (am && !out.age) out.age = am[2];
      if (/[A-Za-z]/.test(name) && name.length < 80 && !/\d[.,]\d/.test(name)) out.originalTitle = name; }
    if (!out.age){ const a = lines.find(l => /^\d{1,2}\+$/.test(l)); if (a) out.age = a; }
    const kp = lines.find(l => /^\d[.,]\d{1,2}$/.test(l)); if (kp) out.kpRating = parseFloat(kp.replace(",", "."));
    const sh = head.slice(1).find(l => l.length >= 40 && l.length <= 300 && l !== out.originalTitle); if (sh) out.short = sh;
    const ds = lines.filter(l => l.length > 150 && !labelOf(l)).sort((a,b) => b.length - a.length)[0]; if (ds && ds !== out.short) out.desc = ds;
    const sm = txt.match(/(\d+)\s+сезон/i); if (sm) out.seasons = +sm[1];
    const em = txt.match(/(\d+)\s+(?:сери[йияю]|эпизод)/i); if (em) out.epTotal = +em[1];
    const ci = lines.findIndex(l => /^в главных ролях/i.test(l));
    if (ci >= 0){ const cast = [];
      for (let i = ci + 1; i < lines.length && cast.length < 14; i++){ const l = lines[i]; if (/^\d+\s*актер/i.test(l) || isIgn(l) || labelOf(l)) break; cast.push(l); }
      if (cast.length) out.cast = cast.join(", "); }
    Object.keys(out).forEach(k => { if (out[k] == null || out[k] === "") delete out[k]; });
    return out;
  }

  // ================= разбор текста Steam =================
  function parseSteam(txt){
    const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean), out = {};
    const after = re => { for (let i = 0; i < lines.length; i++){ const m = lines[i].match(re); if (m){ const v = (m[1] || "").trim(); return v || (lines[i+1] || "").trim(); } } return ""; };
    out.title = after(/^(?:название|title)\s*:\s*(.*)$/i);
    if (!out.title){ const crumb = lines.find(l => /^(все игры|all games)\s*>/i.test(l)); if (crumb) out.title = crumb.split(">").pop().trim(); }
    out.genre = after(/^(?:жанры?|genres?)\s*:?\s*(.*)$/i) || after(/^(?:метки|популярные метки|теги|tags)\s*:?\s*(.*)$/i);
    if (out.genre) out.genre = normGenres(out.genre, true);
    out.release = after(/^(?:дата выхода|release date)\s*:?\s*(.*)$/i);
    if (/(бесплатно|free to play)/i.test(txt)) out.free = true;
    const rub = txt.match(/(\d[\d\s\u00a0]*)(?:[.,]\d{2})?\s*(?:руб\.?|₽)/i), kzt = txt.match(/(\d[\d\s\u00a0]*)(?:[.,]\d{2})?\s*(?:₸|тг|тенге)/i);
    if (rub) out.rub = +rub[1].replace(/\D/g, ""); else if (kzt) out.kzt = +kzt[1].replace(/\D/g, "");
    const label = /^(название|жанр|разработчик|издатель|франшиза|дата выхода|все игры|title|genre|developer|publisher|franchise|release|all games)/i;
    const desc = lines.filter(l => l.length > 60 && !label.test(l)).sort((a,b) => b.length - a.length)[0];
    if (desc) out.desc = desc;
    Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
    return out;
  }

  // ================= перетаскивание (календарь и тир-лист) =================
  function dragger(root, {canStart, onDrop, onClick, zoneSel}){
    let st = null, ghost = null, over = null;
    root.addEventListener("pointerdown", e => {
      const t = e.target.closest("[data-drag]"); if (!t || e.button > 0) return;
      st = {id: t.dataset.drag, el: t, x: e.clientX, y: e.clientY, moved: false};
      t.setPointerCapture(e.pointerId);
    });
    root.addEventListener("pointermove", e => {
      if (!st) return;
      if (!st.moved){
        if (Math.hypot(e.clientX - st.x, e.clientY - st.y) < 6 || !canStart()) return;
        st.moved = true; st.el.classList.add("lift");
        const it = items.find(i => i.id === st.id);
        ghost = document.createElement("div"); ghost.className = "ghost";
        ghost.innerHTML = it && it.cover ? `<img alt="" src="${blobUrl(it.cover)}" style="${posStyle(it.coverPos)}">` : `<div class="nm">${esc(it ? it.title : "")}</div>`;
        document.body.appendChild(ghost);
      }
      ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
      const el = document.elementFromPoint(e.clientX, e.clientY), z = el && el.closest ? el.closest(zoneSel) : null;
      if (z !== over){ over && over.classList.remove("over"); over = z; over && over.classList.add("over"); }
    });
    const end = e => {
      if (!st) return; const s = st; st = null;
      s.el.classList.remove("lift"); if (ghost){ ghost.remove(); ghost = null; }
      const z = over; over && over.classList.remove("over"); over = null;
      if (!s.moved){ if (e.type === "pointerup" && onClick) onClick(s.id); return; }
      if (z) onDrop(s.id, z, e);
    };
    root.addEventListener("pointerup", end);
    root.addEventListener("pointercancel", end);
  }

  function blip(S, f = 1500){ if (!S.sound) return; try { S.actx = S.actx || new (window.AudioContext || window.webkitAudioContext)(); const a = S.actx, o = a.createOscillator(), g = a.createGain();

  function spin(S){
    const pool = S.pool();
    if (S.spinning || pool.length < 2) return; S.spinning = true;
    const cands = pool.filter(i => !S.last || i.id !== S.last.id);
    let win = cands[Math.floor(Math.random() * cands.length)]; S.last = win;
    const N = 64, W = 56, seq = [];
    for (let i = 0; i < N; i++) seq.push(pool[Math.floor(Math.random() * pool.length)]);

    const ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cols = ["#ff375f","#ff9f0a","#ffd60a","#30d158","#0a84ff","#bf5af2","#ffffff"];
    const ps = Array.from({length:160}, () => ({x: W/2, y: H*.45, vx: (Math.random()-.5)*16, vy: -Math.random()*15-4, r: Math.random()*6+3, c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*6, va: (Math.random()-.5)*.4}));
    const t0 = performance.now();
    const f = t => { const e = t - t0; ctx.clearRect(0,0,W,H);
      ps.forEach(p => { p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;

  const PN_LABEL = {n: "Новое", c: "Изменено", f: "Исправлено", r: "Удалено"};
  const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  const patchUnseen = () => lsGet("nexus_patch_seen") !== PATCHES[0].v;
  const patchCard = (p, latest) => `<article class="pn${latest ? " latest" : ""}"><div class="pn-h"><span class="pn-v ${p.kind}">${p.kind === "proto" ? "v" : "Патч "}${esc(p.v)}</span>
      <div class="pn-t"><b>${esc(p.title)}</b><small>${p.date ? fmtDate(p.date) : "прототип в Claude"}</small></div>${latest && patchUnseen() ? `<span class="pn-new">NEW</span>` : ""}</div>
      ${Object.entries(PN_LABEL).filter(([k]) => p.sec[k] && p.sec[k].length).map(([k, l]) => `<div class="pn-sec"><h4 class="${k}">${l}</h4><ul>${p.sec[k].map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}
      ${(p.quote || p.sec.quote) ? `<div class="pn-quote">${esc(p.quote || p.sec.quote)}</div>` : ""}</article>`;
  function renderPatch(){
    appleHead("Патчноуты", `<button class="a-link" data-go="more">‹ Ещё</button>`);
    const live = PATCHES.filter(p => p.season == null), proto = PATCHES.filter(p => p.season === 0);
    $("aMain").innerHTML = `<h1 class="a-h1">Патчноуты</h1><p class="a-sub">Всё, что менялось на сайте, от свежего к старому. Текущая версия: <b>${PATCHES[0].v}</b>.</p>
      <div class="pn-season">Сезон 1 · сайт</div>${live.map((p, i) => patchCard(p, i === 0)).join("")}
      <div class="pn-season">Сезон 0 · прототип в Claude</div>${proto.map(p => patchCard(p, false)).join("")}`;
    if (patchUnseen()){ lsSet("nexus_patch_seen", PATCHES[0].v); }
  }
  function patchPopup(){
    if (!patchUnseen() || !ME) return;
    if (lsGet("nexus_patch_pop") === PATCHES[0].v) return;

      <div class="acts" style="margin-top:16px"><button class="ib blue" id="pnAll">Все патчноуты</button><button class="ib" id="pnOk">Понятно</button></div>`);
    s.el.querySelector("#pnOk").onclick = () => s.close();
    s.el.querySelector("#pnAll").onclick = () => { s.close(); go("patch"); };
  }

  function applySecBg(){
    const el = $("secBg"); if (!el) return;
    const tab = (ROUTES[route] || ROUTES.games).tab, c = SECBG && SECBG[tab];
    if (!c || !c.img){ el.hidden = true; document.body.classList.remove("has-secbg"); return; }
    const url = publicUrl(c.img), i = el.querySelector("i");
    if (i.dataset.u !== url){ i.style.backgroundImage = `url('${url}')`; i.dataset.u = url; }
    i.style.filter = `blur(${c.blur ?? 0}px)`; el.style.setProperty("--sb-dim", (c.dim ?? 55) / 100);
    el.hidden = false; document.body.classList.add("has-secbg");
  }
  function bgSheet(sec, initFile){

    const q = x => s.el.querySelector(x);
    const draw = () => { const u = file ? URL.createObjectURL(file) : img ? publicUrl(img) : "";

      q("#sbP b").style.opacity = u ? dim / 100 : 0; q("#sbP span").hidden = !!u; q("#sbRm").hidden = !u;
      q("#sbBv").textContent = blur + "px"; q("#sbDv").textContent = dim + "%"; };
    const take = f => { if (f && f.type.startsWith("image/")){ file = f; draw(); } };
    q("#sbF").onchange = e => take(e.target.files[0]);
    pasteTarget = take; bindDrop(q("#sbP"), take); q("#sbP").onclick = () => q("#sbF").click();
    q("#sbB").oninput = e => { blur = +e.target.value; draw(); };
    q("#sbD").oninput = e => { dim = +e.target.value; draw(); };
    q("#sbRm").onclick = () => { file = null; img = null; draw(); };
    q("#sbNo").onclick = () => s.close();
    q("#sbOk").onclick = async () => { const b = q("#sbOk"); b.disabled = true; b.textContent = "Сохраняю…";

  async function importBackup(f, onProg){
    let j, zip = null;
    if (/\.zip$/i.test(f.name) || /zip/.test(f.type)){ await needZip(); zip = await JSZip.loadAsync(f); const jf = zip.file("nexus.json"); if (!jf) throw 0; j = JSON.parse(await jf.async("string")); }
    else j = JSON.parse(await f.text());
    const list = Array.isArray(j) ? j : j && j.items; if (!Array.isArray(list)) throw 0;
    const k = i => (i.title || "").toLowerCase() + "|" + i.type, have = new Set(MYITEMS.map(k));
    const map = {}, mine = ME.id + "/";
    const remap = async id => {
      if (typeof id !== "string" || !id) return null; if (id in map) return map[id];
      let nid = null; const zf = zip && zip.file("media/" + id);
      if (zf){ try { const type = extMime(id); const b = await zf.async("blob"); nid = (await assets.upload(new Blob([b], {type}), {type})).id; } catch(e){} }
      else if (id.startsWith(mine)) nid = id; // картинка ещё лежит на сервере
      return map[id] = nid;
    };
    let n = 0, skip = 0, pics = 0, idx = 0;
    for (const raw of list){
      idx++; onProg && onProg(idx, list.length);
      const {id, ...body} = raw || {}; if (!body.title){ continue; } if (have.has(k(body))){ skip++; continue; }
      if (body.cover){ body.cover = await remap(body.cover); if (body.cover) pics++; else { delete body.cover; delete body.coverPos; } }
      if (body.wallpaper){ body.wallpaper = await remap(body.wallpaper); if (body.wallpaper) pics++; else delete body.wallpaper; }
      if (Array.isArray(body.shots)){ const out = []; for (const sId of body.shots){ const x = await remap(sId); if (x){ out.push(x); pics++; } } body.shots = out; } else delete body.shots;
      await db.collection("items").add(body); have.add(k(body)); n++;
    }

  function makeBackend(sb, uid){
    const map = new Map(), listeners = []; let loaded = false;
    const snap = () => ({metadata: {fromCache: !loaded, hasPendingWrites: false}, docs: [...map].map(([id, d]) => ({id, exists: true, data: () => d}))});
    const emit = () => listeners.forEach(f => { try { f(snap()); } catch(e){ console.error(e); } });
    async function loadAll(){
      const rows = []; let from = 0;
      for (;;){ const {data, error} = await sb.from("items").select("id,data").eq("user_id", uid).range(from, from + 999); if (error) throw error; rows.push(...data); if (data.length < 1000) break; from += 1000; }
      map.clear(); rows.forEach(r => map.set(r.id, r.data)); loaded = true; emit();
    }
    sb.channel("items-" + uid).on("postgres_changes", {event: "*", schema: "public", table: "items", filter: `user_id=eq.${uid}`}, p => {
      if (p.eventType === "DELETE"){ if (p.old && p.old.id) map.delete(p.old.id); } else if (p.new && p.new.id) map.set(p.new.id, p.new.data);
      emit();
    }).subscribe();
    const metaCache = {}, metaL = {};
    const metaNotify = key => (metaL[key] || []).forEach(fn => fn({exists: metaCache[key] != null, data: () => metaCache[key]}));
    const fail = e => ({code: "unavailable", message: (e && e.message) || String(e)});
    const db = {
      collection(name){
        return {
          onSnapshot(next, err){ listeners.push(next); if (loaded) next(snap()); else loadAll().catch(e => err && err(fail(e))); return () => {}; },
          async add(body){ const id = crypto.randomUUID(); map.set(id, body); emit();
            const {error} = await sb.from("items").insert({id, user_id: uid, data: body});
            if (error){ map.delete(id); emit(); throw fail(error); } return {id}; }
        };
      },
      doc(path){
        const [col, id] = path.split("/");
        if (col === "items") return {
          async get(){ const d = map.get(id); return {id, exists: !!d, data: () => d}; },
          async update(patch){ const cur = map.get(id); if (!cur) throw {code: "invalid_argument", message: "нет записи"};
            const next = {...cur, ...patch}; map.set(id, next); emit();
            const {error} = await sb.from("items").update({data: next, updated_at: new Date().toISOString()}).eq("id", id).eq("user_id", uid);
            if (error){ map.set(id, cur); emit(); throw fail(error); } },
          async delete(){ const cur = map.get(id); map.delete(id); emit();
            const {error} = await sb.from("items").delete().eq("id", id).eq("user_id", uid);
            if (error){ if (cur) map.set(id, cur); emit(); throw fail(error); } }
        };
        const key = id;
        return {
          async get(){ if (!(key in metaCache)){ const {data, error} = await sb.from("meta").select("data").eq("user_id", uid).eq("key", key).maybeSingle(); if (error) throw fail(error); metaCache[key] = data ? data.data : null; }
            return {exists: metaCache[key] != null, data: () => metaCache[key]}; },
          async set(d){ metaCache[key] = d; metaNotify(key); const {error} = await sb.from("meta").upsert({user_id: uid, key, data: d}); if (error) throw fail(error); },
          async delete(){ metaCache[key] = null; metaNotify(key); const {error} = await sb.from("meta").delete().eq("user_id", uid).eq("key", key); if (error) throw fail(error); },
          onSnapshot(fn){ (metaL[key] = metaL[key] || []).push(fn); this.get().then(fn).catch(() => {}); return () => {}; }
        };
      }
    };
    const assets = {
      async upload(blob, opts = {}){
        const type = opts.type || blob.type || "image/png";
        if (blob.size > 20 * 1024 * 1024) throw {code: "too_large"};
        const ext = (type.split("/")[1] || "png").replace("jpeg", "jpg").replace("svg+xml", "svg");
        const path = `${uid}/${crypto.randomUUID()}.${ext}`;
        const {error} = await sb.storage.from("media").upload(path, blob, {contentType: type, cacheControl: "31536000", upsert: false});
        if (error) throw {code: /size|large|exceed/i.test(error.message) ? "too_large" : "upstream_error", message: error.message};
        return {id: path, url: publicUrl(path), sizeBytes: blob.size, contentType: type};
      }
    };
    return {db, assets};
  }

  async function readerFetch(url, action = "title"){

    return d;
  }
  async function readerFromUrl(url){
    if (!url){ toast("Вставь ссылку"); return; }
    const isTitle = /com-?x\.life\/\d+-[^/]+\.html/i.test(url) || (/readmanga|mintmanga|seimanga/i.test(url) && /^https?:\/\/[^/]+\/[a-z0-9_]{3,80}\/?$/i.test(url));

  // выгрузка com-x: CSV / JSON / TXT, поля угадываем по названиям
  const statusFrom = s => { s = String(s || "").toLowerCase(); return /не понрав|брош|drop/.test(s) ? "dropped" : /отлож|hold|pause/.test(s) ? "paused" : /буду|plan|will|later|хочу/.test(s) ? "plan" : /прочит|complet|done|finish|read(ed)?$/.test(s) && !/читаю|reading/.test(s) ? "done" : /читаю|reading|current/.test(s) ? "reading" : null; };
  function parseExport(text, name){
    const out = [];
    const pick = (o, re) => { for (const k in o) if (re.test(k)) return o[k]; return null; };
    const fromObj = (o, st0) => { if (!o || typeof o !== "object") return;
      const title = pick(o, /^(title|name|название|rus|ru_?name|name_?ru)$/i) || pick(o, /title|name|назв/i); if (!title || typeof title !== "string") return;
      const st = statusFrom(pick(o, /status|tab|list|category|катег|вкладк|статус|folder/i)) || st0 || "reading";
      const num = re => { const v = pick(o, re); const n = parseInt(v, 10); return isNaN(n) ? null : n; };
      const url = pick(o, /^(url|link|href|ссылка)$/i) || pick(o, /url|link|ссылк/i);
      out.push({title: String(title).trim(), url: url ? String(url) : null, coverUrl: pick(o, /cover|poster|image|img|обложк|постер/i) || null, status: st,
        chRead: num(/read_?ch|chapters?_?read|прочит|readed|progress|last/i), chTotal: num(/total|chapters?_?count|^chapters?$|всего|глав/i),
        publisher: pick(o, /publisher|издат/i) || null, year: num(/^year|год/i), rating: parseFloat(pick(o, /rating|рейтинг|score/i)) || null}); };
    const t = text.trim();
    if (/\.json$/i.test(name) || /^[\[{]/.test(t)){
      const j = JSON.parse(t);
      const walk = (v, st) => { if (Array.isArray(v)) v.forEach(x => typeof x === "object" ? (pick(x, /title|name|назв/i) ? fromObj(x, st) : walk(x, st)) : null);
        else if (v && typeof v === "object"){ if (pick(v, /^(title|name|название)$/i) && typeof pick(v, /^(title|name|название)$/i) === "string") fromObj(v, st); else for (const k in v) walk(v[k], statusFrom(k) || st); } };
      walk(j, null); return out;
    }
    const lines = t.split(/\r?\n/).filter(l => l.trim());
    const sep = [";", ",", "\t"].find(s => (lines[0] || "").split(s).length > 1 && /title|name|назв/i.test(lines[0]));
    if (sep){
      const split = l => { const r = []; let cur = "", q = false; for (const ch of l){ if (ch === '"'){ q = !q; continue; } if (ch === sep && !q){ r.push(cur); cur = ""; } else cur += ch; } r.push(cur); return r.map(x => x.trim()); };
      const head = split(lines[0]); lines.slice(1).forEach(l => { const v = split(l), o = {}; head.forEach((h, i) => o[h] = v[i]); fromObj(o, null); }); return out;
    }
    let st = "reading";
    lines.forEach(l => { const s = l.replace(/^[-*•\d.)\s]+/, "").trim(); const hs = s.match(/^([^:]{3,30}):?\s*(\(\d+\))?$/); const maybe = statusFrom(s);
      if (maybe && (hs || s.length < 30)){ st = maybe; return; }
      const um = s.match(/https?:\/\/\S+/), title = s.replace(/https?:\/\/\S+/, "").replace(/[—–|-]\s*$/, "").trim();
      if (title) out.push({title, url: um ? um[0] : null, status: st}); });
    return out;
  }
  async function importReads(f){
    if (!/\.(csv|json|txt)$/i.test(f.name) && !/text|json|csv/.test(f.type)){ toast("Нужен файл выгрузки: CSV, JSON или TXT"); return; }
    try {
      const list = parseExport(await f.text(), f.name);
      if (!list.length){ toast("Не нашёл тайтлов в файле"); return; }
      const have = new Set((READS || []).map(r => (r.url || r.title || "").toLowerCase())); let n = 0;
      toast(`Загружаю ${list.length}…`);
      for (const r of list){ const key = (r.url || r.title).toLowerCase(); if (have.has(key)) continue; have.add(key);
        const src = /readmanga|mintmanga/i.test(r.url || "") ? "readmanga" : "comx";
        await saveRead({...r, type: src === "readmanga" ? "manga" : "comic", source: src}); n++; }
      toast(`Готово: ${n} ${plural(n, "тайтл", "тайтла", "тайтлов")}${list.length - n ? `, ${list.length - n} уже были` : ""}`); renderRead();
    } catch(e){ toast("Файл не прочитался: " + e.message); }
  }
  // полка: тянуть мышкой, шорох при наведении
  function wireRack(el){
    let d = null, moved = false, lastSnd = 0;
    el.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button) return; d = {x: e.clientX, l: el.scrollLeft}; moved = false; });
    el.addEventListener("pointermove", e => { if (!d) return; const dx = e.clientX - d.x; if (!moved && Math.abs(dx) > 5){ moved = true; el.classList.add("drag"); try { el.setPointerCapture(e.pointerId); } catch(_){} } if (moved) el.scrollLeft = d.l - dx; });
    const up = () => { d = null; el.classList.remove("drag"); }; el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    el.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    el.addEventListener("pointerover", e => { const m = e.target.closest(".rx-mag"); if (!m || m.contains(e.relatedTarget) || d) return; const t = performance.now(); if (t - lastSnd > 140){ lastSnd = t; SND.paper("soft"); } });

      if (!drag.on){ if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return; drag.on = true; drag.c.classList.add("lift"); }
      const t = document.elementFromPoint(e.clientX, e.clientY), o = t && t.closest(".og-c");
      if (!o || o === drag.c || o.parentNode !== box) return;
      const cs = [...box.children], from = cs.indexOf(drag.c), to = cs.indexOf(o);
      flip(() => box.insertBefore(drag.c, from < to ? o.nextSibling : o)); SND.tick(.5); });
    const end = () => { if (!drag) return; drag.c.classList.remove("lift"); drag = null; };
    box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);
    s.el.querySelector("#ogNo").onclick = () => s.close();
    s.el.querySelector("#ogRate").onclick = () => { const cs = [...box.children], byId = new Map(list.map(i => [i.id, i]));
      flip(() => cs.sort((a, b) => (byId.get(b.dataset.oid).rating ?? -1) - (byId.get(a.dataset.oid).rating ?? -1)).forEach(c => box.appendChild(c))); };
    s.el.querySelector("#ogOk").onclick = async () => { const b = s.el.querySelector("#ogOk"); b.disabled = true; b.textContent = "Сохраняю…";
      const ids = [...box.children].map(c => c.dataset.oid); let bad = 0;
      for (let i = 0; i < ids.length; i++){ const it = items.find(x => x.id === ids[i]); if (!it || it.ord === i) continue;
        try { await db.doc("items/" + it.id).update({ord: i}); it.ord = i; } catch(_){ bad++; } }
      s.close(); toast(bad ? "Часть не сохранилась" : "Порядок сохранён"); render(); };
  }
  document.addEventListener("click", async e => {
    const el = e.target.closest && e.target.closest("[data-ordg],[data-like],[data-wnew],[data-w],[data-wedit],[data-rd],[data-radd],[data-rt],[data-rtab],[data-rv],[data-ftab]"); if (!el || !ME) return;
    if (el.dataset.ordg){ orderSheet(); return; }
    if (el.dataset.like){ toggleLike(el.dataset.like); return; }
    if (el.dataset.wnew){ if (!FR) await loadFriends(); watchSheet(null); return; }
    if (el.dataset.w){ go("watch:" + el.dataset.w); return; }
    if (el.dataset.wedit){ watchSheet(evById(el.dataset.wedit)); return; }
    if (el.dataset.rd){ const r = (READS || []).find(x => x.id === el.dataset.rd); if (r){ if (el.closest(".rx")) flyOpen(el, () => readSheet(r)); else readSheet(r); } return; }
    if (el.dataset.radd){ readSheet(null); return; }
    if (el.dataset.rt != null){ rType = el.dataset.rt; renderRead(); return; }
    if (el.dataset.rtab){ rTab = el.dataset.rtab; renderRead(); return; }
    if (el.dataset.rv){ rView = el.dataset.rv; lsSet("nexus_rview", rView); renderRead(); return; }
    if (el.dataset.ftab){ uTab = el.dataset.ftab; renderUser(); return; }
  });

  // ================= запуск =================
  readHash(); render();
  (async () => {
    if (!CFG.SUPABASE_URL || /ВСТАВЬ|YOUR/i.test(CFG.SUPABASE_URL) || !window.supabase){
      $("sMain").innerHTML = `<div class="s-empty" style="margin-top:20px"><b>Сайт ещё не подключён к базе</b>Открой файл config.js и вставь адрес и ключ проекта Supabase, как написано в инструкции.</div>`;
      return;
    }
    const recoveryLink = /type=recovery/.test(location.hash);
    SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
    SB.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") setTimeout(() => passwordSheet(true), 600); });
    if (recoveryLink) setTimeout(() => { if (/access_token|type=recovery/.test(location.hash)) history.replaceState(null, "", location.pathname + "#games"); }, 1500);
    const {data: {session}} = await SB.auth.getSession();
    if (session) start(session.user); else authScreen();
  })();
})();
</script>
