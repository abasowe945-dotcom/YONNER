<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: три мира под одним iOS-интерфейсом. Игры — Steam в чёрно-серой гамме, кино — онлайн-кинотеатр со стеклом,
   служебные страницы (скоро, календарь, ещё, итоги, дропы) — минимализм Apple. Снизу плавающая панель разделов, окна — iOS-листы. */
:root{
  color-scheme: dark;
  /* игры: Steam, тёмная гамма */
  --s-top:#09090a; --s-bg:#0e0e10; --s-bg2:#141416; --s-panel:#19191c; --s-panel2:#212125; --s-line:#2a2a2f;
  --s-fg:#d8d8dd; --s-dim:#8e8e97; --s-faint:#5a5a63; --s-tag:rgba(255,255,255,.08); --s-tagfg:#c9c9d1;
  --s-acc:#e9e9ee; --s-accfg:#0e0e10; --k-acc:#ffffff; --k-accfg:#16161f;
  --s-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --s-body:"Barlow","Segoe UI",Arial,sans-serif;
  --st-play:#4ea1ff; --st-done:#30d158; --st-drop:#ff453a;
  /* оценки */
  --r-red:#ff453a; --r-yel:#ffd60a; --r-green:#30d158; --target:#ff3b30;
  /* кино */
  --k-bg:#1c1c2b; --k-bg2:#232335; --k-chip:#4a4a5e; --k-chip2:#5a5a70; --k-line:#34344a;
  --k-fg:#f1f1f6; --k-dim:#9d9db3; --k-faint:#6c6c84; --k-gold:#f2d43a;
  --k-ui:"Manrope","Segoe UI",system-ui,sans-serif;
  --white:#ffffff;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Inter",system-ui,sans-serif;
  /* Apple-страницы */
  --c-bg:#f5f5f7; --c-top:rgba(245,245,247,.8); --c-fg:#1d1d1f; --c-dim:#86868b; --c-cell:#ffffff; --c-cell-out:#ececf0; --c-line:#e3e3e8;
  --c-ring:#0071e3; --c-game:#0a84ff; --c-kino:#ff9f0a; --c-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#000;--c-top:rgba(0,0,0,.72);--c-fg:#f5f5f7;--c-dim:#8e8e93;--c-cell:#1c1c1e;--c-cell-out:#111113;--c-line:#2c2c2e;--c-ring:#0a84ff;--c-shadow:none}}
:root[data-theme="dark"]{--c-bg:#000;--c-top:rgba(0,0,0,.72);--c-fg:#f5f5f7;--c-dim:#8e8e93;--c-cell:#1c1c1e;--c-cell-out:#111113;--c-line:#2c2c2e;--c-ring:#0a84ff;--c-shadow:none}
*{box-sizing:border-box}
html,body{background:var(--s-bg)}
body{margin:0;min-height:100vh;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:65}
.world{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.world.in-r{animation:inR .32s cubic-bezier(.2,.8,.2,1)} .world.in-l{animation:inL .32s cubic-bezier(.2,.8,.2,1)} .world.in-f{animation:inF .25s ease}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0}to{opacity:1}}
.press{transition:transform .15s cubic-bezier(.3,.7,.4,1.4)} .press:active{transform:scale(.96)}

/* ===== общий постер ===== */
.poster{position:relative;aspect-ratio:2/3;max-width:100%;overflow:hidden}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.poster .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;font-weight:700;line-height:1.2;text-wrap:balance}
.poster.editable{cursor:pointer}
.poster .edit-hint{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-size:13px;font-weight:600;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);color:#fff;opacity:0;transition:opacity .15s;z-index:3}
.poster.editable:hover .edit-hint{opacity:1}
.poster.drop{outline:3px dashed var(--white);outline-offset:4px}
.rb{position:absolute;top:8px;left:8px;z-index:2;min-width:30px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font:700 13px/1 var(--ios);font-variant-numeric:tabular-nums}
.rb.red{background:var(--r-red);color:#fff} .rb.yellow{background:var(--r-yel);color:#1d1d1f} .rb.green{background:var(--r-green);color:#04230d}
.tgt{position:absolute;top:7px;right:7px;z-index:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);box-shadow:0 0 0 1px rgba(255,59,48,.5)}
.tgt svg{width:20px;height:20px}
.tgt::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(255,59,48,.6);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,59,48,.55)}70%{box-shadow:0 0 0 10px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.src-chip{position:absolute;right:7px;bottom:7px;z-index:2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#d8d8dd;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.src-chip svg{width:16px;height:16px} .src-chip.pirate{color:#e2b45d}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:rgba(242,242,247,.96);color:#1d1d1f;font:600 14px/1.3 var(--ios);padding:11px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toastIn .35s cubic-bezier(.2,.9,.25,1.2)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.view{position:fixed;inset:0;z-index:50;overflow-y:auto;animation:inF .2s ease}
.view .bgimg{position:fixed;inset:0;background-size:cover;background-position:center;pointer-events:none}
.view .shade{position:fixed;inset:0;pointer-events:none}

/* ===== нижняя панель разделов (iOS) ===== */
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--tb-bg,rgba(28,28,30,.72));-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--tb-line,rgba(255,255,255,.1));box-shadow:0 12px 40px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.tab{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border:0;background:none;border-radius:24px;color:var(--tb-fg,#8e8e93);font:600 10.5px/1 var(--ios);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (max-width:430px){.tab{width:64px}}
.tab svg{width:25px;height:25px;transition:transform .3s cubic-bezier(.3,.7,.4,1.6)}
.tab[aria-current="page"]{color:var(--tb-active,#fff);background:var(--tb-pill,rgba(255,255,255,.13))}
.tab.bounce svg{animation:bounce .45s cubic-bezier(.3,.7,.4,1.5)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(.78) translateY(2px)}70%{transform:scale(1.15) translateY(-2px)}100%{transform:scale(1)}}
.tab .dot{position:absolute;top:6px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--target);box-shadow:0 0 0 2px var(--tb-solid,#1c1c1e)}
body.view-open .tabbar,body.ov-open .tabbar,body.sheet-open .tabbar{transform:translate(-50%,170%)}
body[data-theme="kino"]{--tb-bg:color-mix(in srgb,var(--k-bg2) 78%,transparent);--tb-line:rgba(255,255,255,.12);--tb-solid:#242438}
body[data-theme="cal"]{--tb-bg:var(--c-top);--tb-line:var(--c-line);--tb-fg:var(--c-dim);--tb-active:var(--c-ring);--tb-pill:var(--c-cell-out);--tb-solid:var(--c-cell)}
@media (max-width:520px){.tabbar{left:10px;right:10px;transform:none;justify-content:space-between}.tab{flex:1;width:auto}body.view-open .tabbar,body.ov-open .tabbar,body.sheet-open .tabbar{transform:translateY(170%)}}

/* ===== iOS-листы ===== */
.sh-wrap{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-family:var(--ios);color:#f2f2f7}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .28s}
.sh{position:relative;width:min(460px,100%);max-height:100%;overflow-y:auto;background:#1c1c1e;border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0;transform:scale(.94) translateY(10px);transition:opacity .28s,transform .38s cubic-bezier(.2,.9,.25,1.1)}
.sh.wide{width:min(640px,100%)}
.sh-wrap.on .sh-bg{opacity:1} .sh-wrap.on .sh{opacity:1;transform:none}
.sh-grab{display:none}
@media (max-width:640px){
  .sh-wrap{align-items:flex-end;padding:0}
  .sh{width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);max-height:92vh}
  .sh-grab{display:block;width:38px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 14px}
}
.sh h3{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sh .sub{margin:0 0 18px;color:#8e8e93;font-size:14px}
.sh label.f{display:grid;gap:6px;font-size:13px;color:#8e8e93;margin-bottom:12px}
.in{width:100%;min-width:0;background:#2c2c2e;border:0;border-radius:12px;padding:12px 14px;color:#f2f2f7;font-size:16px}
.in:focus{outline:2px solid #0a84ff;outline-offset:0}
textarea.in{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font:600 16px/1 var(--ios);cursor:pointer;background:#2c2c2e;color:#f2f2f7;transition:transform .15s cubic-bezier(.3,.7,.4,1.4),background .15s}
.ib:active{transform:scale(.96)} .ib:hover{background:#3a3a3c}
.ib.blue{background:#0a84ff;color:#fff} .ib.blue:hover{background:#2b95ff}
.ib.red{background:rgba(255,69,58,.16);color:#ff6961} .ib.red:hover{background:rgba(255,69,58,.26)}
.ib.green{background:#30d158;color:#04230d}
.ib.full{width:100%}
.ib svg{width:19px;height:19px}
.ib:disabled{opacity:.4;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--seg-bg,rgba(255,255,255,.08))}
.seg button,.seg a{border:0;background:transparent;color:var(--seg-fg,#c7c7cc);font:600 14px/1 var(--ios);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--seg-on,#636366);color:var(--seg-onfg,#fff);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.seg small{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.qa-poster{width:120px;border-radius:12px;background:#2c2c2e;cursor:pointer;flex:none}
.qa-poster .ph{color:#8e8e93;font:500 12px/1.3 var(--ios)}
.qa-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.qa-top > div:last-child{flex:1;min-width:0}

/* ===== STEAM / ИГРЫ ===== */
body[data-theme="games"]{background:var(--s-bg);color:var(--s-fg);font-family:var(--s-body)}
body[data-theme="games"]::before{background:var(--s-top)}
.s-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--s-top) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--s-line)}
.s-top-in{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:66px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s-logo{font-family:var(--s-display);font-weight:700;font-size:26px;letter-spacing:.08em;color:var(--hi);white-space:nowrap;display:flex;align-items:center;gap:10px}
.s-logo i{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,transparent 19%),radial-gradient(circle,#5a5a63 0 55%,#2a2a2f 56%)}
.s-search{position:relative;flex:1 1 200px;max-width:300px;min-width:0;margin-left:auto}
.s-search input{width:100%;background:var(--s-panel2);border:1px solid var(--s-line);border-radius:12px;padding:9px 36px 9px 14px;color:var(--hi)}
.s-search input::placeholder{color:var(--s-dim)}
.s-search input:focus{outline:none;border-color:#55555e}
.s-search svg{position:absolute;right:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--s-dim);pointer-events:none}
body[data-theme="games"] .seg{--seg-bg:var(--s-panel);--seg-on:var(--s-acc);--seg-onfg:var(--s-accfg)}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-family:var(--s-body);font-weight:600;font-size:15px;color:var(--s-accfg);background:var(--s-acc);white-space:nowrap;transition:transform .15s cubic-bezier(.3,.7,.4,1.4),background .15s}
.s-btn:hover{filter:brightness(1.08)} .s-btn:active{transform:scale(.96)}
.s-btn.dark{background:var(--s-panel2);color:var(--s-fg);border:1px solid var(--s-line)} .s-btn.dark:hover{background:#2a2a2f;color:var(--hi)}
.s-btn.green{background:var(--st-done);color:#04230d} .s-btn.green:hover{background:#4ee173}
.s-btn.red{background:rgba(255,69,58,.14);color:#ff6961} .s-btn.red:hover{background:rgba(255,69,58,.24)}
.s-btn.hot{background:linear-gradient(135deg,#ff3b30,#ff9f0a);color:#fff;box-shadow:0 6px 20px rgba(255,80,40,.3)}
.s-btn svg{width:18px;height:18px}
.s-main{max-width:1300px;margin:0 auto;padding-top:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.s-h1{margin:0;font-family:var(--s-display);font-weight:600;font-size:clamp(30px,4vw,42px);letter-spacing:.04em;text-transform:uppercase;color:var(--hi)}
.s-stats{display:flex;gap:6px;flex-wrap:wrap}
.s-stat{background:var(--s-panel);border:1px solid var(--s-line);border-radius:14px;padding:10px 16px;min-width:96px}
.s-stat b{display:block;font-family:var(--s-display);font-size:28px;font-weight:600;line-height:1;color:var(--hi);font-variant-numeric:tabular-nums}
.s-stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--s-dim)}
.s-stat.blue b{color:var(--st-play)} .s-stat.green b{color:var(--st-done)} .s-stat.red b{color:var(--st-drop)}
.s-shelf-h{margin:30px 0 12px;font-family:var(--s-display);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--hi);display:flex;align-items:center;gap:12px}
.s-shelf-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--s-line),transparent)}
.s-row{display:grid;grid-auto-flow:column;grid-auto-columns:160px;gap:16px;overflow-x:auto;padding:26px 22px 30px;margin:-22px -22px -20px;scrollbar-width:thin}
.s-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:26px}
.s-sel{margin-left:auto;background:var(--s-panel2);border:1px solid var(--s-line);border-radius:10px;padding:8px 10px;color:var(--s-fg);font-size:14px}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 16px;margin-top:20px}
.s-card{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left;color:inherit}
body[data-theme="games"] .poster{border-radius:14px;background:linear-gradient(180deg,#26262b,#16161a);box-shadow:0 6px 16px rgba(0,0,0,.5);transition:transform .2s cubic-bezier(.3,.7,.4,1.3),box-shadow .2s}
body[data-theme="games"] .poster .ph{font-family:var(--s-display);font-size:21px;text-transform:uppercase;color:#7c7c86;letter-spacing:.02em}
.s-card:hover .poster{box-shadow:0 0 0 2px #55555e,0 14px 30px rgba(0,0,0,.65)}
.s-card:active .poster{transform:scale(.97)}
.s-card .t{margin-top:9px;color:var(--hi);font-weight:600;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-card .m{margin-top:4px;font-size:13px;color:var(--s-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.s-flag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.s-flag.playing{background:rgba(78,161,255,.16);color:#7db9ff} .s-flag.done{background:rgba(48,209,88,.16);color:#5fe07f} .s-flag.dropped{background:rgba(255,69,58,.16);color:#ff7b72}
.s-empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--s-dim);background:var(--s-panel);border:1px dashed var(--s-line);border-radius:18px}
.s-empty b{display:block;color:var(--hi);font-family:var(--s-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.s-src{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.s-srcb{position:relative;display:flex;align-items:center;gap:14px;cursor:pointer;border:1px solid var(--s-line);background:var(--s-panel);padding:14px 16px;border-radius:18px;text-align:left;color:var(--s-fg);overflow:hidden;transition:border-color .15s,transform .2s cubic-bezier(.3,.7,.4,1.4)}
.s-srcb:hover{border-color:#44444b} .s-srcb:active{transform:scale(.98)}
.s-srcb .lg{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#0b0b0c;color:#c9c9d1}
.s-srcb .lg svg{width:28px;height:28px}
.s-srcb b{display:block;font-family:var(--s-display);font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:var(--hi);line-height:1}
.s-srcb small{color:var(--s-dim);font-size:13px}
.s-srcb[aria-pressed="true"]{border-color:#8e8e97;background:linear-gradient(135deg,#26262b,#18181b)}
.s-srcb[aria-pressed="true"] .lg{background:var(--s-acc);color:#0e0e10}

.k-acts .k-btn svg{width:24px;height:24px}
.view .k-btn{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.view .k-btn:hover{background:rgba(255,255,255,.24)}
.view .k-btn.white{background:var(--k-acc)}
.k-lower{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;margin-top:40px;padding:30px 34px}
.k-lower h3{margin:0 0 14px;font-size:26px;font-weight:300;color:var(--k-dim)}
.k-lower p{margin:0 0 30px;font-size:19px;line-height:1.55;max-width:70ch;white-space:pre-wrap}
.k-lower > div > :last-child{margin-bottom:0}
.k-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.k-tags span{border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 18px;font-size:18px;font-weight:500}
.k-tags span:first-child{background:rgba(255,255,255,.2)}
.k-facts{border-left:1px solid rgba(255,255,255,.16);padding-left:28px;display:grid;gap:18px;align-content:start;margin:0}
.k-facts dt{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-dim)}
.k-facts dd{margin:4px 0 0;font-size:20px;font-weight:700}
.k-why{margin:0 0 30px;padding:12px 16px;border-radius:14px;background:rgba(255,69,58,.14);border:1px solid rgba(255,69,58,.35);font-size:17px}
.k-why b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#ff8a86;margin-bottom:2px}
.k-form{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:40px;align-items:start}
.k-fields{display:grid;gap:16px;max-width:720px}
.k-fields label{display:grid;gap:6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--k-dim)}
.k-in{background:var(--k-bg2);border:2px solid var(--k-line);border-radius:12px;padding:11px 14px;font-size:16px;color:var(--k-fg);min-width:0;width:100%}
.k-in:focus{outline:none;border-color:var(--k-dim)}
textarea.k-in{min-height:120px;resize:vertical}
.k-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
@media (max-width:820px){
  .k-hero{grid-template-columns:1fr;gap:24px}.k-hero .poster{width:min(260px,70%)}
  .k-hero .k-glass,.k-lower{padding:22px 20px}
  .k-lower{grid-template-columns:1fr;gap:10px}
  .k-facts{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.16);padding-top:20px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .k-acts .k-btn{font-size:16px;padding:12px 18px}.k-meta{font-size:16px}
  .k-form{grid-template-columns:1fr}.k-form .poster{width:min(220px,60%)}
  .k-clock{display:none}
}
@media (max-width:640px){.k-grid,.s-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 12px}.k-row,.s-row{grid-auto-columns:120px}}

/* ===== Apple-страницы ===== */
body[data-theme="cal"]{background:var(--c-bg);color:var(--c-fg);font-family:var(--ios)}
body[data-theme="cal"]::before{background:var(--c-top)}
body[data-theme="cal"] .seg{--seg-bg:var(--c-cell-out);--seg-fg:var(--c-fg);--seg-on:var(--c-cell);--seg-onfg:var(--c-fg)}
.a-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--c-top);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--c-line)}
.a-top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:54px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.a-logo{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.a-logo span{color:var(--c-dim);font-weight:500}
.a-main{max-width:1080px;margin:0 auto;padding-top:26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.a-h1{margin:0;font-size:clamp(32px,5vw,46px);font-weight:700;letter-spacing:-.025em;line-height:1.05}
.a-h1 span{color:var(--c-dim);font-weight:500}
.a-sub{margin:8px 0 0;color:var(--c-dim);font-size:15px}
.a-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--c-ring);color:#fff;font:600 14px/1 var(--ios);cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.4)}
.a-btn:active{transform:scale(.95)}
.a-btn.gray{background:var(--c-cell-out);color:var(--c-fg)}
.a-link{border:0;background:none;color:var(--c-ring);font:500 15px/1 var(--ios);cursor:pointer;padding:6px 8px;border-radius:8px}
.a-link:hover{background:var(--c-cell-out)}
.a-empty{padding:40px 20px;text-align:center;color:var(--c-dim);background:var(--c-cell);border-radius:20px;box-shadow:var(--c-shadow)}
.a-empty b{display:block;color:var(--c-fg);font-size:18px;margin-bottom:4px}
/* скоро */
.so-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}
.so{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:20px;background:var(--c-cell);box-shadow:var(--c-shadow);cursor:pointer;text-align:left;border:0;color:inherit;transition:transform .2s cubic-bezier(.3,.7,.4,1.3)}
.so:active{transform:scale(.98)}
.so .poster{width:86px;border-radius:12px;background:var(--c-cell-out)}
.so .poster .ph{font-size:12px;color:var(--c-dim)}
.so .ty{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.so .ty.game{color:var(--c-game)} .so .ty.kino{color:var(--c-kino)}
.so h4{margin:2px 0 4px;font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.so .dt{font-size:14px;color:var(--c-dim)}
.so .cd{text-align:right;padding-right:6px}
.so .cd b{display:block;font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.so .cd small{font-size:13px;color:var(--c-dim)}
.so.out .cd b{font-size:20px;color:var(--r-green)}
.so-h{margin:30px 0 0;font-size:20px;font-weight:600}
/* ещё */
.mo-group{margin-top:24px;background:var(--c-cell);border-radius:18px;overflow:hidden;box-shadow:var(--c-shadow)}
.mo-row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border:0;background:none;color:inherit;text-align:left;font:500 16px/1.2 var(--ios);cursor:pointer;text-decoration:none;transition:background .15s}
.mo-row + .mo-row{border-top:1px solid var(--c-line)}
.mo-row:hover{background:var(--c-cell-out)} .mo-row:active{background:var(--c-line)}
.mo-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.mo-ic svg{width:19px;height:19px}
.mo-row .t{flex:1;min-width:0}
.mo-row .t small{display:block;color:var(--c-dim);font-size:13px;margin-top:2px}
.mo-row .chev{color:var(--c-dim);font-size:20px}
.mo-cap{margin:24px 4px -12px;font-size:13px;color:var(--c-dim);text-transform:uppercase;letter-spacing:.04em}
/* итоги */
.rc-hero{margin-top:18px;padding:34px 28px;border-radius:28px;background:radial-gradient(120% 120% at 0% 0%,#ff375f 0%,transparent 55%),radial-gradient(120% 120% at 100% 100%,#5e5ce6 0%,transparent 60%),#16161a;color:#fff;overflow:hidden}
.rc-hero .y{font-size:clamp(60px,14vw,140px);font-weight:800;letter-spacing:-.05em;line-height:.85}
.rc-hero p{margin:12px 0 0;font-size:18px;opacity:.85;max-width:40ch}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.rc-c{background:var(--c-cell);border-radius:22px;padding:18px;box-shadow:var(--c-shadow)}
.rc-c b{display:block;font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rc-c small{display:block;margin-top:6px;color:var(--c-dim);font-size:14px}
.rc-sec{margin-top:14px;background:var(--c-cell);border-radius:24px;padding:20px;box-shadow:var(--c-shadow)}
.rc-sec h3{margin:0 0 14px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.rc-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.rc-m{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.rc-m i{display:block;border-radius:4px;min-height:0}
.rc-m span{font-size:11px;color:var(--c-dim);text-align:center;margin-top:4px}
.rc-top{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.rc-top .poster{border-radius:12px;background:var(--c-cell-out)}
.rc-top .poster .ph{font-size:12px;color:var(--c-dim)}
.rc-top .t{margin-top:6px;font-size:13px;font-weight:600;line-height:1.2}
.rc-top .n{position:absolute;left:8px;bottom:6px;z-index:2;font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);line-height:1}
.rc-genres{display:grid;gap:10px}
.rc-g{display:grid;grid-template-columns:140px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:15px}
.rc-g .b{height:12px;border-radius:6px;background:var(--c-cell-out);overflow:hidden}
.rc-g .b i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff375f,#ff9f0a)}
.rc-g .n{text-align:right;color:var(--c-dim);font-variant-numeric:tabular-nums}
@media (max-width:640px){.rc-top{grid-template-columns:repeat(3,minmax(0,1fr))}.rc-g{grid-template-columns:100px minmax(0,1fr) 30px}}
/* стена дропов */
.fr-list{margin-top:18px}
.fr-ava{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px/1 var(--ios);color:#fff;letter-spacing:-.02em;overflow:hidden;position:relative}

.fr-ava.xs{width:18px;height:18px;font-size:9px;display:inline-grid;vertical-align:middle}
.mt .ic .fr-ava{width:40px;height:40px}

.av-lb{margin-top:14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}

.fr-pct{flex:none;font:700 14px/1 var(--ios);padding:6px 10px;border-radius:999px;background:var(--c-cell-out);color:var(--c-fg);font-variant-numeric:tabular-nums}
.fr-pct.hi{background:rgba(48,209,88,.18);color:#30d158}.fr-pct.mid{background:rgba(255,214,10,.18);color:#d6a700}.fr-pct.lo{background:rgba(255,69,58,.16);color:#ff453a}
.fd-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;background:none;color:inherit;text-align:left;font:400 15px/1.3 var(--ios);cursor:pointer}

.fd-row .t{flex:1;min-width:0}.fd-row .t small{display:block;color:var(--c-dim);font-size:13px;margin-top:2px}

.up-head{display:flex;align-items:center;gap:18px;margin-top:6px}

.fr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-top:12px}
.fr-card{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;transition:transform .15s}

.fr-card.have .t::after{content:" · есть";color:#30d158;font-weight:500}
.fr-h{margin:26px 0 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.fr-h small{color:var(--c-dim);font-weight:500;margin-left:6px}
.cmp-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}

.cmp-row b{flex:none;width:40px;text-align:center;font-variant-numeric:tabular-nums}
.cmp-row b small{display:block;font-size:10px;color:var(--c-dim);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.cmp-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

.rc-sec .a-btn svg{width:18px;height:18px;flex:none}
.cr-box{text-align:center;padding:6px 0 2px}

.cr-box .t{margin-top:12px;font-size:22px;font-weight:700;letter-spacing:-.01em;min-height:28px}

.top-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill-btn{--pill-bg:#1c1c1e;--pill-ring:linear-gradient(135deg,#7f5cff,#00c2ff);display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid transparent;
  background:linear-gradient(var(--pill-bg),var(--pill-bg)) padding-box,var(--pill-ring) border-box;color:inherit;font:600 14px/1 var(--ios);cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:transform .15s cubic-bezier(.3,.7,.4,1.5),box-shadow .2s}

.k-top-in{gap:14px}

.s-search,.k-search{flex-basis:120px!important}

@media (max-width:1380px){.k-clock{display:none}}
@media (max-width:620px){.me-chip{padding:0 4px}.me-chip .nm{display:none}.pill-btn{height:34px;padding:0 12px 0 10px;font-size:13px}}

.sec-bg i{position:absolute;inset:-40px;background-size:cover;background-position:center}
.sec-bg::after{content:"";position:absolute;inset:0;background:var(--sb-ov,#000);opacity:var(--sb-dim,.6)}

.sb-prev span{position:absolute;inset:0;display:grid;place-items:center;color:#8e8e93;font-size:14px}
.sb-rng{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;margin-top:8px;font-size:14px}

.fv-ban .t{flex:1;min-width:140px;display:flex;flex-direction:column;gap:3px}

  .c-kind{left:3px;bottom:3px;width:15px;height:15px;border-radius:5px}.c-kind svg{width:10px!important;height:10px!important}.c-tiles{gap:2px;padding:2px}.c-t{border-radius:8px}
  .c-t .nm,.c-relb{display:none}
  .c-tiles.n3 .c-rate,.c-tiles.n4 .c-rate,.c-tiles.n2 .c-rate{display:none}
}

/* ===== рулетка ===== */
.rl{position:fixed;inset:0;z-index:78;overflow-y:auto;color:#fff;font-family:var(--ios);background:#050507}
.rl-bg{position:fixed;inset:-20%;background:conic-gradient(from 0deg at 50% 50%,#ff375f22,#5e5ce622,#0a84ff22,#ff9f0a22,#ff375f22);filter:blur(60px);animation:spinbg 18s linear infinite;pointer-events:none}
@keyframes spinbg{to{transform:rotate(360deg)}}
.rl-x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;cursor:pointer;display:grid;place-items:center}
.rl-x svg{width:18px;height:18px}
.rl-in{position:relative;max-width:1200px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top,0px)) 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.rl-kicker{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ff9f0a}
.rl-h{margin:8px 0 6px;font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1}
.rl-sub{margin:0 0 30px;color:rgba(255,255,255,.6)}
.rl-win{position:relative;height:330px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.rl-strip{position:absolute;left:0;top:30px;display:flex;gap:16px;will-change:transform}
.rl-t{flex:none;width:170px;transition:transform .5s cubic-bezier(.2,.9,.25,1.3),opacity .5s,filter .5s}
.rl-t .poster{border-radius:16px;background:#1c1c1e;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rl-t .poster .ph{color:#8e8e93;font-size:15px}
.rl-t .tt{margin-top:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-strip.done .rl-t{opacity:.25;filter:grayscale(.8) blur(1px)}
.rl-strip.done .rl-t.win{opacity:1;filter:none;transform:scale(1.14)}
.rl-strip.done .rl-t.win .poster{box-shadow:0 0 0 3px #fff,0 0 60px 10px rgba(255,159,10,.55),0 20px 50px rgba(0,0,0,.6)}
.rl-mark{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;z-index:3;border-radius:2px;background:linear-gradient(180deg,transparent,#fff 15%,#fff 85%,transparent);box-shadow:0 0 18px 3px rgba(255,255,255,.6)}
.rl-mark::before,.rl-mark::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:10px solid transparent}
.rl-mark::before{top:0;border-top-color:#fff} .rl-mark::after{bottom:0;border-bottom-color:#fff}
.rl-mark.tick{animation:tick .12s ease-out}
@keyframes tick{50%{transform:scaleX(1.8)}}
.rl-acts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:20px;padding:0 16px}
.rl-go{position:relative;border:0;border-radius:999px;padding:18px 54px;font:800 20px/1 var(--ios);letter-spacing:.02em;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff375f,#ff9f0a);box-shadow:0 10px 40px rgba(255,80,60,.45);transition:transform .2s cubic-bezier(.3,.7,.4,1.5)}
.rl-go:hover{transform:scale(1.04)} .rl-go:active{transform:scale(.95)}
.rl-go:disabled{opacity:.4;cursor:default;transform:none}
.rl-go.ghostb{background:rgba(255,255,255,.12);box-shadow:none}
.rl-res{min-height:120px;margin-top:20px;padding:0 16px}
.rl-res h3{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;animation:pop .5s cubic-bezier(.2,.9,.25,1.4)}
.rl-res p{margin:6px 0 0;color:rgba(255,255,255,.65)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
.rl-cf{position:fixed;inset:0;pointer-events:none;z-index:6}
@media (max-width:640px){.rl-win{height:240px}.rl-t{width:120px}.rl-go{padding:16px 40px}}

/* ===== тир-лист ===== */
.tier{position:fixed;inset:0;z-index:60;overflow-y:auto;background:#0b0b0d;color:#f2f2f7;font-family:var(--ios);animation:inF .2s ease}
.tier-in{max-width:1200px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tier-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tier-h h2{margin:0;font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
.tier-h p{margin:0;color:#8e8e93;font-size:14px;flex-basis:100%}
.tr{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:124px;border-radius:16px;overflow:hidden;background:#1c1c1e;margin-bottom:8px}
.tl{display:grid;place-items:center;font-size:34px;font-weight:800;color:#111}
.tz{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start;min-height:124px;transition:background .15s}
.tz.over{background:#2c2c2e}
.tt{width:72px;cursor:grab;touch-action:none;user-select:none;transition:transform .15s}
.tt:active{cursor:grabbing}
.tt .poster{border-radius:10px;background:#2c2c2e}
.tier .tt .poster .ph{font-size:10px;letter-spacing:0;color:#8e8e93;padding:4px;font-family:var(--ios);text-transform:none}
.tt .rb{top:4px;left:4px;min-width:24px;height:18px;font-size:11px;padding:0 5px}
.tt .tgt,.tt .src-chip{display:none}
.tt.lift{opacity:.25}
.tr.pool{background:#141416;border:1px dashed #3a3a3c}
.tr.pool .tl{color:#8e8e93;font-size:13px;font-weight:600;background:#1c1c1e;text-align:center;padding:4px}
@media (max-width:640px){.tr{grid-template-columns:52px minmax(0,1fr)}.tl{font-size:26px}.tt{width:58px}}

/* ===== медаль, кровавый прицел, таймер ===== */
.medal,.blood{position:absolute;top:6px;left:6px;z-index:2;width:34px;height:40px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.medal svg,.blood svg{width:100%;height:100%;overflow:visible}
.blood .drip{animation:drip 2.8s ease-in infinite;transform-origin:top}
.blood .drip.d2{animation-delay:1.1s}.blood .drip.d3{animation-delay:1.9s}
@keyframes drip{0%{transform:scaleY(.2);opacity:0}15%{opacity:1}70%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1.15) translateY(3px);opacity:0}}
.rb.bl{top:auto;bottom:8px}
.tier .medal,.tier .blood{width:22px;height:26px;top:3px;left:auto;right:3px}
.tmr{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--s-dim);font-variant-numeric:tabular-nums}
.tmr svg{width:13px;height:13px}
.tmr.run{color:#7db9ff}
.s-timer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--s-bg2);border-radius:16px;padding:14px 16px}
.s-timer .n{font-family:var(--s-display);font-size:52px;font-weight:700;line-height:.9;color:var(--hi);font-variant-numeric:tabular-nums}
.s-timer .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--s-dim)}
.s-timer .tx{font-size:15px;color:var(--s-fg);margin-top:2px}
.s-timer.run .n{color:#7db9ff}.s-timer.done .n{color:#f5c542}.s-timer.dropped .n{color:var(--st-drop)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7db9ff;margin-right:6px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25;transform:scale(.7)}}

/* ===== свечение статусов, бесконечные, жанры, релизы ===== */
.s-card.st-done .poster{box-shadow:0 26px 34px -16px rgba(48,209,88,.75),0 6px 16px rgba(0,0,0,.5)}
.s-card.st-dropped .poster{box-shadow:0 26px 34px -16px rgba(255,59,48,.8),0 6px 16px rgba(0,0,0,.5)}
.s-card.st-endless .poster{box-shadow:0 26px 34px -16px rgba(191,90,242,.7),0 6px 16px rgba(0,0,0,.5)}
.s-card.st-done:hover .poster{box-shadow:0 0 0 2px rgba(48,209,88,.8),0 26px 40px -14px rgba(48,209,88,.8)}
.s-card.st-dropped:hover .poster{box-shadow:0 0 0 2px rgba(255,69,58,.8),0 26px 40px -14px rgba(255,59,48,.85)}
.s-card.st-endless:hover .poster{box-shadow:0 0 0 2px rgba(191,90,242,.8),0 26px 40px -14px rgba(191,90,242,.8)}
.medal.inf{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#bf5af2,#5e5ce6);color:#fff;font:700 24px/1 var(--ios);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.s-flag.endless{background:rgba(191,90,242,.18);color:#d69cff}
.s-stat.purple b{color:#bf5af2}
.chips button[aria-pressed="true"].endless{background:#bf5af2;border-color:#bf5af2;color:#fff}
.s-pricebox .st.endless{background:#bf5af2;color:#fff}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gchips button{border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-dim);border-radius:999px;padding:6px 12px;font:600 13px/1 var(--s-body);cursor:pointer;text-transform:none;letter-spacing:0;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),background .15s,color .15s}
.gchips button:hover{color:var(--hi);border-color:#55555e}.gchips button:active{transform:scale(.93)}
.gchips button[aria-pressed="true"]{background:var(--s-acc);color:var(--s-accfg);border-color:var(--s-acc)}
.rel-prec{display:grid;gap:8px;justify-items:start}
.rel-prec input{max-width:260px}
.k-sec{display:flex;align-items:center;gap:14px;margin:38px 0 0}
.k-sec h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.k-sec span{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--k-dim);font-variant-numeric:tabular-nums}
.k-sec i{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
.k-sec + .k-grid{margin-top:16px}

/* ===== компактные источники ===== */
.src-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src-p{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--s-line);background:transparent;color:var(--s-dim);border-radius:999px;padding:5px 12px 5px 10px;font:600 13px/1 var(--s-body);cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),color .15s,background .15s}
.src-p:hover{color:var(--hi);border-color:#55555e}.src-p:active{transform:scale(.94)}
.src-p .i{display:inline-flex;width:16px;height:16px}.src-p .i svg{width:100%;height:100%}
.src-p small{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.src-p[aria-pressed="true"]{background:var(--s-acc);color:var(--s-accfg);border-color:var(--s-acc)}
.src-p.pirate[aria-pressed="true"]{background:#d6a24a;border-color:#d6a24a;color:#1a1208}
.rel .dd.editable{cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),box-shadow .15s}
.rel .dd.editable:hover{box-shadow:0 0 0 2px rgba(255,255,255,.5)}.rel .dd.editable:active{transform:scale(.92)}
.rel-in{display:flex;flex-wrap:wrap;gap:8px}
.rel-in input,.rel-in select{max-width:200px}

/* ===== колесо оценки ===== */
.s-rate{background:var(--s-bg2);border-radius:16px;padding:14px 16px}
.s-rate .lb,.k-rate .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--s-dim);margin-bottom:10px}
.k-rate{margin-top:20px;max-width:560px}
.k-rate .lb{color:var(--k-dim)}
.rw-wrap{display:grid;gap:8px}
.rw{position:relative;height:64px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.rw-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;touch-action:pan-x;user-select:none}
.rw-track::-webkit-scrollbar{display:none}
.rw-track.drag{cursor:grabbing;scroll-snap-type:none}
.rw-pad{flex:none;width:calc(50% - 30px)}
.rw-i{flex:none;width:60px;height:100%;display:grid;place-items:center;scroll-snap-align:center;font:600 20px/1 var(--ios);color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums;transition:color .15s,transform .2s cubic-bezier(.3,.7,.4,1.4)}
.rw-i.half{font-size:14px}
.rw-i.on{color:var(--hi);transform:scale(1.35)}
.rw-i.on.red{color:var(--r-red)}.rw-i.on.yellow{color:var(--r-yel)}.rw-i.on.green{color:var(--r-green)}
.rw-mark{position:absolute;left:50%;top:8px;bottom:8px;width:60px;margin-left:-30px;border-radius:12px;border:2px solid rgba(255,255,255,.55);pointer-events:none;transition:border-color .2s}
.rw-mark.red{border-color:var(--r-red)}.rw-mark.yellow{border-color:var(--r-yel)}.rw-mark.green{border-color:var(--r-green)}
.rw-out{font:600 14px/1.2 var(--ios);color:rgba(255,255,255,.6);text-transform:none;letter-spacing:0}
.rw-out b{font-size:16px}
.rw-out .red{color:var(--r-red)}.rw-out .yellow{color:var(--r-yel)}.rw-out .green{color:var(--r-green)}

/* ===== календарь выходов в разделах (в духе Steam) ===== */
.rel-box{margin-top:22px;border-radius:20px;padding:16px;background:var(--rel-bg,var(--s-panel));border:1px solid var(--rel-line,var(--s-line))}
.rel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rel-h h3{margin:0;font:600 15px/1 var(--rel-font,var(--s-display));letter-spacing:.12em;text-transform:uppercase;color:var(--hi)}
.rel-h small{color:var(--rel-dim,var(--s-dim));font-size:13px}
.rel-list{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,340px);gap:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.rel{display:grid;grid-template-columns:54px 50px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--rel-card,rgba(255,255,255,.04));border:0;color:inherit;text-align:left;cursor:pointer;transition:transform .2s cubic-bezier(.3,.7,.4,1.3),background .15s}
.rel:hover{background:var(--rel-hover,rgba(255,255,255,.08))} .rel:active{transform:scale(.97)}
.rel .dd{display:grid;place-items:center;align-content:center;height:62px;border-radius:10px;background:var(--rel-date,#000);color:#fff;text-align:center}
.rel .dd small{font:700 11px/1 var(--ios);letter-spacing:.08em;text-transform:uppercase;color:var(--rel-acc,#ff6961)}
.rel .dd b{font:700 26px/1 var(--ios);margin-top:3px;font-variant-numeric:tabular-nums}
.rel .poster{width:50px;border-radius:7px;box-shadow:none!important}
.rel .poster .ph{font-size:9px!important;padding:3px}
.rel h4{margin:0;font:600 15px/1.2 var(--rel-font2,var(--s-body));color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .g{font-size:12px;color:var(--rel-dim,var(--s-dim));margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .cd{display:inline-block;margin-top:5px;font:700 12px/1 var(--ios);padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-variant-numeric:tabular-nums}
.rel .cd.now{background:var(--r-green);color:#04230d}
.rel-empty{color:var(--rel-dim,var(--s-dim));font-size:14px;padding:6px 2px}
body[data-theme="kino"] .rel-box{--rel-bg:rgba(255,255,255,.05);--rel-line:rgba(255,255,255,.1);--rel-dim:var(--k-dim);--rel-font:var(--k-ui);--rel-font2:var(--k-ui);--rel-acc:var(--k-gold);--rel-date:#14141f}
@media (max-width:640px){.rel-list{grid-auto-columns:86%}}

/* ===== плитки «Ещё» в стиле Metro ===== */
.bk{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 12px 12px 14px;border-radius:16px;background:rgba(48,209,88,.10);border:1px solid rgba(48,209,88,.28)}
.bk.warn{background:rgba(255,159,10,.12);border-color:rgba(255,159,10,.4)}
.bk-ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:#30d158;color:#04210d}

.bk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bk-t b{font-size:15px;font-weight:650}.bk-t small{font-size:12.5px;color:var(--c-dim);line-height:1.3}

@media (max-width:520px){.bk{flex-wrap:wrap}.bk .ib{width:100%}}
.mt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.mt{position:relative;aspect-ratio:1/1;border:0;border-radius:10px;padding:16px;color:#fff;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s cubic-bezier(.3,.7,.4,1.3),box-shadow .2s;box-shadow:0 2px 10px rgba(0,0,0,.12)}

.mt:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.25)}

.mt .ic{width:54px;height:54px}
.mt .ic svg{width:100%;height:100%;stroke-width:1.6}
.mt .lb{font:600 16px/1.2 var(--ios)}
.mt .lb small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.mt .live{position:absolute;right:16px;top:14px;font:800 44px/1 var(--ios);letter-spacing:-.03em;opacity:.95;font-variant-numeric:tabular-nums}

.mt::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
@media (max-width:760px){.mt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== цена ===== */
.price-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.price-row .free{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-fg);cursor:pointer;font-weight:600;font-size:14px;text-transform:none;letter-spacing:0}

.cur{position:relative}

/* ===== рулетка: свои варианты ===== */
.rl-add{max-width:620px;margin:22px auto 0;padding:0 16px;display:grid;gap:10px}
.rl-add form{display:flex;gap:8px;flex-wrap:wrap}
.rl-add .in{flex:1 1 160px;background:rgba(255,255,255,.08)}
.rl-add select.in{flex:0 1 130px}
.rl-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rl-chips span{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px}
.rl-chips button{border:0;background:rgba(255,255,255,.15);color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1}
.rl-note{font-size:13px;color:rgba(255,255,255,.5)}

/* ===== кинопоиск ===== */
.k-quick{background:rgba(255,255,255,.04);border:2px dashed var(--k-line);padding:12px;border-radius:14px}
.k-quick p{margin:0 0 8px;font-size:14px;color:var(--k-fg);text-transform:none;letter-spacing:0}

.s-card.stale .poster{filter:grayscale(.7) brightness(.6)}

.ep-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0 12px}

.ep-btns{display:flex;gap:8px}
.ep-btns .k-btn:disabled{opacity:.35;cursor:default}
.shots{margin-top:4px}

.shots-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.shot{flex:none;width:112px;aspect-ratio:16/9;border:0;padding:0;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05);cursor:pointer;opacity:.8;transition:opacity .15s,transform .15s}

.shot.add svg{width:18px;height:18px}

.lbx{position:fixed;inset:0;z-index:92;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(50px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(60px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:inF .2s ease}
.lbx img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb-x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}

.lb-b{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;color:rgba(255,255,255,.7);font:600 14px/1 var(--ios)}
.bt-arena{display:grid;grid-template-columns:minmax(0,260px) auto minmax(0,260px);gap:28px;justify-content:center;align-items:center;padding:0 16px}
.bt-c{border:0;background:none;padding:0;color:#fff;cursor:pointer;text-align:center;transition:transform .35s cubic-bezier(.2,.9,.25,1.2),opacity .35s,filter .35s}
.bt-c .poster{border-radius:18px;background:#1c1c1e;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:box-shadow .2s,transform .2s cubic-bezier(.3,.7,.4,1.4)}
.bt-c .poster .ph{color:#8e8e93;font-size:18px}
.bt-c:hover .poster{transform:translateY(-6px) scale(1.03);box-shadow:0 0 0 3px #fff,0 24px 50px rgba(0,0,0,.6)}
.bt-t{display:block;margin-top:12px;font:700 19px/1.2 var(--ios)}
.bt-g{display:block;margin-top:3px;font-size:14px;color:rgba(255,255,255,.55)}
.bt-vs{font:900 44px/1 var(--ios);letter-spacing:-.04em;background:linear-gradient(135deg,#ff375f,#ff9f0a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:vs 1.6s ease-in-out infinite}
@keyframes vs{50%{transform:scale(1.12) rotate(-4deg)}}
.bt-c.won .poster{box-shadow:0 0 0 4px #30d158,0 0 50px 8px rgba(48,209,88,.45)}
.bt-c.out-l{transform:translateX(-120%) rotate(-18deg);opacity:0}
.bt-c.out-r{transform:translateX(120%) rotate(18deg);opacity:0}
.bt-c.in-r{animation:btIn .45s cubic-bezier(.2,.9,.25,1.2)}

.bt-prog{max-width:420px;height:6px;margin:30px auto 0;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bt-prog i{display:block;height:100%;background:linear-gradient(90deg,#ff375f,#ff9f0a);transition:width .4s}
.bt-win{width:min(260px,60%);margin:18px auto 0;animation:pop .6s cubic-bezier(.2,.9,.25,1.3)}
.bt-win .poster{border-radius:18px;box-shadow:0 0 0 3px #fff,0 0 70px 12px rgba(255,214,10,.45)}
@media (max-width:640px){.bt-arena{grid-template-columns:1fr 1fr;gap:12px}.bt-vs{grid-column:1/-1;grid-row:1;justify-self:center;font-size:30px}.bt-t{font-size:15px}}
.view .bgimg.wall{opacity:1!important;transform:scale(1.06)!important;height:auto!important;inset:0}
.view.haswall .shade{background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.35))!important}
.pen.k.w{right:68px}
.wp-prev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#2c2c2e;margin-bottom:14px;display:grid;place-items:center}
.wp-img{position:absolute;inset:-10px;background-size:cover;background-position:center}

.sh input[type=range]{width:100%;accent-color:#0a84ff}
.th-pre{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.th-pre button{display:flex;align-items:center;gap:8px;border:1px solid #3a3a3c;background:#2c2c2e;color:#f2f2f7;border-radius:12px;padding:8px 10px;font:600 13px/1 var(--ios);cursor:pointer}
.th-pre button:hover{background:#3a3a3c}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}

/* ===== вход ===== */
.auth{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:radial-gradient(80% 60% at 20% 10%,#2a1530,transparent 70%),radial-gradient(70% 60% at 90% 90%,#0f2340,transparent 70%),#08080a;font-family:var(--ios);color:#f2f2f7}

:root[data-mode="light"] .s-meter,:root[data-mode="light"] .s-timer,:root[data-mode="light"] .s-rate{background:var(--s-bg2)}
/* ===== 2.2: плашка «На будущее» у названия ===== */
.t-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fut-pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 12px;border-radius:999px;border:1px solid rgba(128,128,128,.32);color:inherit;opacity:.8;text-decoration:none;font:600 13px/1 var(--ios);letter-spacing:0;text-transform:none;transition:opacity .2s,background .2s,transform .2s cubic-bezier(.3,1.4,.4,1)}
.fut-pill:hover{opacity:1;background:rgba(128,128,128,.12);transform:translateX(2px)}
.fut-pill b{font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(128,128,128,.2);font-size:11.5px}
.fut-pill svg{width:13px;height:13px;opacity:.7}

/* ===== 2.2: день рождения без года ===== */
.bd-f{display:grid;grid-template-columns:.8fr 1.3fr 1.2fr;gap:8px}
.bd-f select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#8e8e93 50%),linear-gradient(135deg,#8e8e93 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}

/* ===== 2.2: релиз через 0–3 дня ===== */
.rel.hot{grid-template-columns:66px 66px minmax(0,1fr);padding:12px;position:relative;isolation:isolate;background:linear-gradient(135deg,rgba(255,59,48,.24),rgba(255,159,10,.12) 60%,rgba(255,255,255,.03))!important}
.rel.hot::before{content:"";position:absolute;inset:-1.5px;border-radius:16px;padding:1.5px;background:conic-gradient(from var(--ha,0deg),#ff3b30,#ff9f0a,#ffd60a,#ff375f,#ff3b30);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hotSpin 3s linear infinite;z-index:-1}
@property --ha{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes hotSpin{to{--ha:360deg}}
.rel.hot .dd{height:76px;background:linear-gradient(160deg,#ff453a,#b3170c)!important;box-shadow:0 6px 18px rgba(255,59,48,.45)}
.rel.hot .dd small{color:#ffe1dc!important}.rel.hot .dd b{font-size:32px}
.rel.hot .poster{width:66px}
.rel.hot h4{font-size:18px!important}
.rel.hot .cd{background:#ff3b30!important;color:#fff!important;animation:hotPulse 1.4s ease-in-out infinite}
@keyframes hotPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.6)}50%{box-shadow:0 0 0 6px rgba(255,59,48,0)}}
.hot-b{display:inline-block;margin:0 0 4px;font:800 10.5px/1 var(--ios);letter-spacing:.12em;color:#ff6b5e}
.rel-list.carou > .rel.hot{width:440px}
@media (max-width:640px){.rel-list.carou > .rel.hot{width:88vw}}

/* ===== 2.2: мини-окно активности друзей ===== */
.fw{position:fixed;right:18px;bottom:20px;z-index:60;width:262px;border-radius:18px;padding:8px;font:500 12px/1.3 var(--ios);color:#ececf1;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03)),rgba(24,24,28,.5);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 34px rgba(0,0,0,.3);opacity:.72;transition:opacity .25s,transform .35s cubic-bezier(.3,1.3,.4,1);animation:fwIn .5s cubic-bezier(.2,.9,.25,1.1)}
.fw:hover{opacity:1}
@keyframes fwIn{from{opacity:0;transform:translateY(14px)}}
.fw.min{width:auto;padding:4px;border-radius:999px}
:root[data-mode="light"] .fw{color:#1d1d1f;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.55));border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff,0 12px 34px rgba(0,0,0,.12)}
.fw-h{display:flex;align-items:center;gap:8px;padding:2px 6px 6px;font:700 11px/1 var(--ios);letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.fw-h span{flex:1}
.fw-h a{color:inherit;text-decoration:none;text-transform:none;letter-spacing:0;font-weight:600}
.fw-h a:hover{text-decoration:underline}
.fw-h button{width:20px;height:20px;border-radius:50%;border:0;background:rgba(128,128,128,.22);color:inherit;cursor:pointer;font:700 13px/1 var(--ios)}
.fw-r{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:7px;align-items:center;width:100%;padding:5px 6px;border:0;border-radius:10px;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.fw-r:hover{background:rgba(128,128,128,.16)}
.fw-r > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.fw-r b{font-weight:700}
.fw-r small{opacity:.5;font-size:11px;white-space:nowrap}
.fw-pill{display:flex;align-items:center;gap:6px;border:0;background:none;color:inherit;cursor:pointer;padding:0 8px 0 0;font:700 12px/1 var(--ios)}
.fw-pill .ava-stack .fr-ava{width:22px;height:22px;font-size:10px}
body.view-open .fw,body.sheet-open .fw{display:none}
@media (max-width:1100px){.fw{display:none}}

/* ===== 2.2: ужасы — кровь из-за постера и мрак ===== */
.pwrap > .poster{position:relative;z-index:2}
.k-hcol .pv-acts{position:relative;z-index:3}
.k-lower{position:relative;z-index:2}
.k-hero .k-glass{z-index:2}
.k-view{overflow-x:clip}
.gore{position:absolute;pointer-events:none;z-index:1;overflow:visible}
.dread{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.85)),linear-gradient(rgba(60,0,0,.22),rgba(20,0,0,.35));opacity:0;animation:dreadIn 2.6s ease-out .1s forwards}
@keyframes dreadIn{0%{opacity:0}35%{opacity:.75}42%{opacity:.35}48%{opacity:.85}100%{opacity:1}}
:root[data-mode="light"] .dread{background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 35%,rgba(10,0,0,.35) 72%,rgba(10,0,0,.6)),linear-gradient(rgba(60,0,0,.12),rgba(20,0,0,.2))}
@media (prefers-reduced-motion:reduce){.dread{animation:none;opacity:.8}}

/* ===== 2.2: профиль друга в стиле Netflix ===== */
body[data-route="user"]{--c-bg:#141414;--c-top:rgba(20,20,20,.86);--c-fg:#fff;--c-dim:#a3a3a3;--c-cell:#1f1f1f;--c-cell-out:#2a2a2a;--c-line:#2f2f2f;--c-shadow:none;background:#141414!important;color:#fff}
body[data-route="user"] .tabbar{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(26,26,30,.4);border-color:rgba(255,255,255,.18)}
body[data-route="user"] .tb-lens{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08))}
body[data-route="user"] .tab{color:rgba(235,235,245,.6)} body[data-route="user"] .tab[aria-current="page"]{color:#fff}
body[data-route="user"] .site-ft{color:#6b6b6b}
body[data-route="user"] .a-main{max-width:none;padding:0}
.nf{font-family:var(--ios);margin-top:-26px}
.nf-hero{position:relative;min-height:min(62vh,560px);display:flex;align-items:flex-end;padding:0 max(4%,16px) 46px;overflow:hidden}
.nf-hero .bg{position:absolute;inset:-30px;background:var(--bg) center/cover no-repeat;filter:blur(2px) saturate(1.15);transform:scale(1.05);animation:nfZoom 22s ease-in-out infinite alternate}
.nf-hero .bg.blank{background:radial-gradient(80% 90% at 75% 20%,var(--ac,#e50914) 0,transparent 60%),radial-gradient(60% 70% at 10% 90%,#2a2a2a,transparent 70%),#141414;filter:none}
@keyframes nfZoom{to{transform:scale(1.14) translate(-1.5%,1%)}}
.nf-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,20,.94) 0,rgba(20,20,20,.65) 40%,rgba(20,20,20,.1) 75%),linear-gradient(0deg,#141414 0,rgba(20,20,20,0) 45%)}
.nf-in{position:relative;z-index:2;display:flex;gap:26px;align-items:flex-end;width:100%;max-width:1300px;margin:0 auto}
.nf-ava .fr-ava{width:128px;height:128px;border-radius:14px;font-size:58px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.nf-ava .fr-ava img{border-radius:14px}
.nf-txt{flex:1;min-width:0}
.nf-kick{display:flex;align-items:center;gap:8px;font:800 12px/1 var(--ios);letter-spacing:.24em;color:#e50914;text-transform:uppercase}
.nf-kick i{width:16px;height:22px;background:linear-gradient(#e50914,#b20710);clip-path:polygon(0 0,35% 0,100% 100%,65% 100%);display:inline-block}
.nf-nick{margin:8px 0 10px;font:900 clamp(44px,7vw,92px)/.95 var(--ios);letter-spacing:-.035em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.nf-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font:600 15px/1 var(--ios);color:#d6d6d6}
.nf-meta .m{color:#46d369;font-weight:800}
.nf-meta .b{border:1px solid rgba(255,255,255,.4);padding:3px 6px;border-radius:3px;font-size:12px}
.nf-now{display:flex;align-items:center;gap:14px;margin-top:20px;max-width:560px}
.nf-now .poster{width:58px;border-radius:6px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.nf-now .poster .rb,.nf-now .poster .medal,.nf-now .poster .src-chip{display:none}
.nf-now small{display:block;font:700 11px/1 var(--ios);letter-spacing:.14em;text-transform:uppercase;color:#a3a3a3;margin-bottom:6px}
.nf-now b{font:800 22px/1.15 var(--ios)}
.nf-now span{display:block;color:#bcbcbc;font-size:14px;margin-top:3px}
.nf-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.nf-btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 22px 0 18px;border-radius:5px;border:0;font:700 16px/1 var(--ios);cursor:pointer;text-decoration:none;transition:background .2s,transform .15s}
.nf-btn svg{width:20px;height:20px}
.nf-btn.w{background:#fff;color:#141414}.nf-btn.w:hover{background:rgba(255,255,255,.78)}
.nf-btn.g{background:rgba(109,109,110,.7);color:#fff}.nf-btn.g:hover{background:rgba(109,109,110,.45)}
.nf-btn:active{transform:scale(.96)}
.nf-bdt{position:absolute;top:46px;right:max(4%,16px);z-index:2;font:500 11.5px/1.4 var(--ios);color:#9b9b9b;text-align:right;letter-spacing:.02em}
.nf-bdt b{display:block;color:#e5e5e5;font-weight:600}
.nf-body{max-width:1300px;margin:0 auto;padding:6px max(4%,16px) 0}
.nf-h{margin:34px 0 14px;font:800 21px/1 var(--ios);letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.nf-h small{font:600 13px/1 var(--ios);color:#808080}
.nf-h .more{margin-left:auto;font:600 13px/1 var(--ios);color:#808080;text-decoration:none}
.nf-h .more:hover{color:#fff}
/* колоды */
.nf-decks{display:flex;flex-wrap:wrap;gap:20px 50px}
.nf-deckw h3{margin:0 0 4px;font:700 15px/1 var(--ios);color:#bcbcbc;display:flex;gap:8px}
.nf-deckw h3 small{color:#6b6b6b}
.deck{--cw:136px;--sp:96px;position:relative;height:calc(var(--cw) * 1.5 + 70px);width:calc(var(--cw) + (var(--n) - 1) * var(--sp) + 70px);max-width:100%}
.dk{position:absolute;left:34px;top:30px;width:var(--cw);padding:0;border:0;background:none;color:#fff;cursor:pointer;transform-origin:50% 140%;z-index:var(--i);transform:translateX(calc(var(--i) * 22px)) rotate(var(--r)) translateY(calc(var(--d) * 1px));transition:transform .75s cubic-bezier(.18,.95,.22,1.12) calc(var(--i) * 32ms),filter .4s;filter:brightness(.85)}
.dk .poster{border-radius:12px;background:#2a2a2a;box-shadow:0 14px 30px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.dk .poster .ph{font-size:12px;color:#9b9b9b}
.dk .poster::after{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);transition:transform 0s}
.dk-t{position:absolute;left:0;right:0;top:calc(100% + 10px);font:700 13px/1.2 var(--ios);text-align:center;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck:hover .dk,.deck:focus-within .dk{transform:translateX(calc(var(--i) * var(--sp))) rotate(0deg);filter:brightness(1)}
.deck:hover .dk:hover,.deck .dk:focus-visible{z-index:60;transform:translateX(calc(var(--i) * var(--sp))) translateY(-30px) scale(1.16);transition:transform .5s cubic-bezier(.2,1.4,.3,1) 0s,filter .3s;filter:brightness(1.08) drop-shadow(0 26px 30px rgba(0,0,0,.7))}
.deck .dk:hover .poster::after{transform:translateX(130%);transition:transform .9s cubic-bezier(.3,.6,.3,1) .05s}
.deck .dk:hover .dk-t{opacity:1;transform:none}
@media (hover:none),(max-width:640px){.deck{width:auto;overflow-x:auto;height:calc(var(--cw) * 1.5 + 60px);--cw:118px}.dk{transform:translateX(calc(var(--i) * (var(--cw) + 10px)))!important;filter:none}.dk-t{opacity:1;transform:none}}
/* ряды как у Netflix */
.nf-row{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:8px;overflow-x:auto;overflow-y:visible;padding:16px 4px 30px;margin:-16px -4px -20px;scrollbar-width:none}
.nf-row::-webkit-scrollbar{display:none}
.nf-c{position:relative;padding:0;border:0;background:none;color:#fff;cursor:pointer;text-align:left;transition:transform .35s cubic-bezier(.2,.9,.3,1.2) .08s,z-index 0s .3s;z-index:1}
.nf-c .poster{border-radius:6px;background:#2a2a2a;overflow:hidden}
.nf-c .poster .ph{font-size:12px;color:#9b9b9b}
.nf-c .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 8px;border-radius:0 0 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.92));font:700 12.5px/1.2 var(--ios);opacity:0;transition:opacity .25s .1s;z-index:5}
.nf-c .cap small{display:block;font-weight:500;color:#bcbcbc;margin-top:3px;font-size:11px}
.nf-c .cap .m{color:#46d369;font-weight:800}
.nf-c:hover{transform:scale(1.2);z-index:5;transition-delay:.12s,0s}
.nf-c:hover .poster{box-shadow:0 18px 40px rgba(0,0,0,.75)}
.nf-c:hover .cap{opacity:1}
.nf-c:first-child{transform-origin:left center}.nf-c:last-child{transform-origin:right center}
.nf-c.have::after{content:"есть";position:absolute;top:6px;left:6px;z-index:6;font:800 10px/1 var(--ios);padding:4px 6px;border-radius:3px;background:#46d369;color:#06240f;text-transform:uppercase;letter-spacing:.06em}
/* низ: активность и сводка */
.nf-low{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;margin-top:10px}
.nf-act .fx{border-color:#2f2f2f}
.nf-act .fx:hover{background:#1f1f1f}
.nf-side{font:500 12.5px/1.5 var(--ios);color:#9b9b9b;padding-top:48px}
.nf-side dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.nf-side dt{color:#6b6b6b}.nf-side dd{margin:0;color:#d6d6d6;text-align:right}
.nf-side .cmp{margin-top:18px;padding-top:14px;border-top:1px solid #2f2f2f}
.nf-side .cmp b{font-size:26px;color:#46d369;display:block;line-height:1;margin-bottom:4px}
.nf-side .cmp .r{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
@media (max-width:820px){.nf-in{flex-direction:column;align-items:flex-start;gap:16px}.nf-ava .fr-ava{width:92px;height:92px;font-size:40px}.nf-low{grid-template-columns:1fr;gap:10px}.nf-side{padding-top:0}.nf-hero{min-height:0;padding-top:90px}.nf-row{grid-auto-columns:118px}}

/* ===== 2.2: мероприятия ===== */
.ev-card h3 .ev-add{margin-left:auto;width:28px;height:28px;border-radius:50%;border:0;background:var(--c-ring);color:#fff;font:600 19px/1 var(--ios);cursor:pointer;display:grid;place-items:center}
.ev-card h3 .ev-add + small{margin-left:0}
.ev-row{display:flex;align-items:center;gap:11px;width:100%;padding:7px 4px;border:0;border-radius:12px;background:none;color:inherit;text-align:left;cursor:pointer;font:500 14px/1.25 var(--ios)}
.ev-row:hover{background:var(--c-cell-out)}
.ev-row.past{opacity:.5}
.ev-th{flex:none;width:46px;height:46px;border-radius:11px;background:var(--g,linear-gradient(135deg,#5e5ce6,#bf5af2)) center/cover;display:grid;place-items:center;align-content:center;color:#fff;text-align:center;overflow:hidden}
.ev-th small{font:800 9px/1 var(--ios);letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.ev-th b{font:800 18px/1 var(--ios)}
.ev-row .t{flex:1;min-width:0}.ev-row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev-row .t small{display:block;color:var(--c-dim);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-inv{margin:2px 0 10px;padding:10px;border-radius:14px;background:linear-gradient(135deg,rgba(10,132,255,.16),rgba(191,90,242,.12));border:1px solid rgba(10,132,255,.3)}
.ev-inv .k{font:800 10.5px/1 var(--ios);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ring);margin:0 0 6px 4px}
.ev-inv .acts{margin:6px 0 0;gap:6px}
.ev-inv .ib{padding:8px 12px;font-size:13px;border-radius:10px;flex:1}
.ev-note{display:block;width:100%;margin-top:8px;border:0;background:none;color:var(--c-ring);font:600 12.5px/1.3 var(--ios);cursor:pointer;text-align:left;padding:4px}
.tab .dot.n{width:auto;min-width:17px;height:17px;padding:0 5px;top:2px;right:12px;border-radius:999px;font:800 10.5px/17px var(--ios);color:#fff;background:#ff3b30;text-align:center}
/* страница мероприятия */
.evp{max-width:880px;margin:0 auto}
.evp-hero{position:relative;border-radius:26px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;background:var(--g) center/cover;box-shadow:var(--c-shadow)}
.evp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,.1) 60%,rgba(0,0,0,0))}
.evp-hero .in{position:relative;z-index:2;padding:26px 28px;color:#fff;width:100%}
.evp-hero .when{font:800 13px/1 var(--ios);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.evp-hero h1{margin:8px 0 0;font:800 clamp(30px,5vw,48px)/1.02 var(--ios);letter-spacing:-.025em}
.evp-hero .cd{position:absolute;top:18px;right:18px;z-index:2;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font:700 13px/1 var(--ios)}
.evp-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px}
.evp-info .ios-row{cursor:default}
.evp-info a{color:var(--c-ring);text-decoration:none;font-weight:600}
.evp-desc{padding:16px;font:400 15.5px/1.55 var(--ios);white-space:pre-wrap}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.rsvp button{height:46px;border-radius:13px;border:1.5px solid var(--c-line);background:var(--c-cell-out);color:var(--c-fg);font:700 15px/1 var(--ios);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s cubic-bezier(.3,1.4,.4,1),background .2s}
.rsvp button:active{transform:scale(.95)}
.rsvp button.go[aria-pressed="true"]{background:#30d158;border-color:#30d158;color:#04230d}
.rsvp button.no[aria-pressed="true"]{background:#ff453a;border-color:#ff453a;color:#fff}
.rsvp-k{padding:12px 14px 0;font:600 13px/1.35 var(--ios);color:var(--c-dim)}
.mem{padding:12px 14px}
.mem h4{margin:10px 0 6px;font:700 12px/1 var(--ios);letter-spacing:.08em;text-transform:uppercase;color:var(--c-dim);display:flex;gap:6px}
.mem h4:first-child{margin-top:0}
.mem h4.go{color:#30d158}.mem h4.no{color:#ff453a}
.mem .p{display:flex;align-items:center;gap:9px;padding:4px 0;font:500 14px/1.2 var(--ios);border:0;background:none;color:inherit;width:100%;text-align:left;cursor:pointer}

.hm-tile{position:relative;overflow:hidden;min-height:150px;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;text-decoration:none;box-shadow:var(--c-shadow);background:var(--g);isolation:isolate;transition:transform .35s cubic-bezier(.3,1.3,.4,1)}
