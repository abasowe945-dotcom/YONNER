<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NEXUS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: три мира под одним iOS-интерфейсом. Игры — Steam в чёрно-серой гамме, кино — онлайн-кинотеатр со стеклом,
   служебные страницы (скоро, календарь, ещё, итоги, дропы) — минимализм Apple. Снизу плавающая панель разделов, окна — iOS-листы. */
:root{
  color-scheme: dark;
  /* игры: Steam, тёмная гамма */
  --s-top:#09090a; --s-bg:#0e0e10; --s-bg2:#141416; --s-panel:#19191c; --s-panel2:#212125; --s-line:#2a2a2f;
  --s-fg:#d8d8dd; --s-dim:#8e8e97; --s-faint:#5a5a63; --s-tag:rgba(255,255,255,.08); --s-tagfg:#c9c9d1;
  --s-acc:#e9e9ee; --s-accfg:#0e0e10; --k-acc:#ffffff; --k-accfg:#16161f;
  --s-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --s-body:"Barlow","Segoe UI",Arial,sans-serif;
  --st-play:#4ea1ff; --st-done:#30d158; --st-drop:#ff453a;
  /* оценки */
  --r-red:#ff453a; --r-yel:#ffd60a; --r-green:#30d158; --target:#ff3b30;
  /* кино */
  --k-bg:#1c1c2b; --k-bg2:#232335; --k-chip:#4a4a5e; --k-chip2:#5a5a70; --k-line:#34344a;
  --k-fg:#f1f1f6; --k-dim:#9d9db3; --k-faint:#6c6c84; --k-gold:#f2d43a;
  --k-ui:"Manrope","Segoe UI",system-ui,sans-serif;
  --white:#ffffff;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Inter",system-ui,sans-serif;
  /* Apple-страницы */
  --c-bg:#f5f5f7; --c-top:rgba(245,245,247,.8); --c-fg:#1d1d1f; --c-dim:#86868b; --c-cell:#ffffff; --c-cell-out:#ececf0; --c-line:#e3e3e8;
  --c-ring:#0071e3; --c-game:#0a84ff; --c-kino:#ff9f0a; --c-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#000;--c-top:rgba(0,0,0,.72);--c-fg:#f5f5f7;--c-dim:#8e8e93;--c-cell:#1c1c1e;--c-cell-out:#111113;--c-line:#2c2c2e;--c-ring:#0a84ff;--c-shadow:none}}
:root[data-theme="dark"]{--c-bg:#000;--c-top:rgba(0,0,0,.72);--c-fg:#f5f5f7;--c-dim:#8e8e93;--c-cell:#1c1c1e;--c-cell-out:#111113;--c-line:#2c2c2e;--c-ring:#0a84ff;--c-shadow:none}
*{box-sizing:border-box}
html,body{background:var(--s-bg)}
body{margin:0;min-height:100vh;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:65}
.world{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.world.in-r{animation:inR .32s cubic-bezier(.2,.8,.2,1)} .world.in-l{animation:inL .32s cubic-bezier(.2,.8,.2,1)} .world.in-f{animation:inF .25s ease}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0}to{opacity:1}}
.press{transition:transform .15s cubic-bezier(.3,.7,.4,1.4)} .press:active{transform:scale(.96)}

/* ===== общий постер ===== */
.poster{position:relative;aspect-ratio:2/3;max-width:100%;overflow:hidden}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.poster .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;font-weight:700;line-height:1.2;text-wrap:balance}
.poster.editable{cursor:pointer}
.poster .edit-hint{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-size:13px;font-weight:600;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);color:#fff;opacity:0;transition:opacity .15s;z-index:3}
.poster.editable:hover .edit-hint{opacity:1}
.poster.drop{outline:3px dashed var(--white);outline-offset:4px}
.rb{position:absolute;top:8px;left:8px;z-index:2;min-width:30px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font:700 13px/1 var(--ios);font-variant-numeric:tabular-nums}
.rb.red{background:var(--r-red);color:#fff} .rb.yellow{background:var(--r-yel);color:#1d1d1f} .rb.green{background:var(--r-green);color:#04230d}
.tgt{position:absolute;top:7px;right:7px;z-index:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);box-shadow:0 0 0 1px rgba(255,59,48,.5)}
.tgt svg{width:20px;height:20px}
.tgt::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(255,59,48,.6);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,59,48,.55)}70%{box-shadow:0 0 0 10px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.src-chip{position:absolute;right:7px;bottom:7px;z-index:2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#d8d8dd;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.src-chip svg{width:16px;height:16px} .src-chip.pirate{color:#e2b45d}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:rgba(242,242,247,.96);color:#1d1d1f;font:600 14px/1.3 var(--ios);padding:11px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toastIn .35s cubic-bezier(.2,.9,.25,1.2)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.view{position:fixed;inset:0;z-index:50;overflow-y:auto;animation:inF .2s ease}
.view .bgimg{position:fixed;inset:0;background-size:cover;background-position:center;pointer-events:none}
.view .shade{position:fixed;inset:0;pointer-events:none}

/* ===== нижняя панель разделов (iOS) ===== */
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--tb-bg,rgba(28,28,30,.72));-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--tb-line,rgba(255,255,255,.1));box-shadow:0 12px 40px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.tab{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border:0;background:none;border-radius:24px;color:var(--tb-fg,#8e8e93);font:600 10.5px/1 var(--ios);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (max-width:430px){.tab{width:64px}}
.tab svg{width:25px;height:25px;transition:transform .3s cubic-bezier(.3,.7,.4,1.6)}
.tab[aria-current="page"]{color:var(--tb-active,#fff);background:var(--tb-pill,rgba(255,255,255,.13))}
.tab.bounce svg{animation:bounce .45s cubic-bezier(.3,.7,.4,1.5)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(.78) translateY(2px)}70%{transform:scale(1.15) translateY(-2px)}100%{transform:scale(1)}}
.tab .dot{position:absolute;top:6px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--target);box-shadow:0 0 0 2px var(--tb-solid,#1c1c1e)}
body.view-open .tabbar,body.ov-open .tabbar,body.sheet-open .tabbar{transform:translate(-50%,170%)}
body[data-theme="kino"]{--tb-bg:color-mix(in srgb,var(--k-bg2) 78%,transparent);--tb-line:rgba(255,255,255,.12);--tb-solid:#242438}
body[data-theme="cal"]{--tb-bg:var(--c-top);--tb-line:var(--c-line);--tb-fg:var(--c-dim);--tb-active:var(--c-ring);--tb-pill:var(--c-cell-out);--tb-solid:var(--c-cell)}
@media (max-width:520px){.tabbar{left:10px;right:10px;transform:none;justify-content:space-between}.tab{flex:1;width:auto}body.view-open .tabbar,body.ov-open .tabbar,body.sheet-open .tabbar{transform:translateY(170%)}}

/* ===== iOS-листы ===== */
.sh-wrap{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-family:var(--ios);color:#f2f2f7}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .28s}
.sh{position:relative;width:min(460px,100%);max-height:100%;overflow-y:auto;background:#1c1c1e;border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0;transform:scale(.94) translateY(10px);transition:opacity .28s,transform .38s cubic-bezier(.2,.9,.25,1.1)}
.sh.wide{width:min(640px,100%)}
.sh-wrap.on .sh-bg{opacity:1} .sh-wrap.on .sh{opacity:1;transform:none}
.sh-grab{display:none}
@media (max-width:640px){
  .sh-wrap{align-items:flex-end;padding:0}
  .sh{width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);max-height:92vh}
  .sh-grab{display:block;width:38px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 14px}
}
.sh h3{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sh .sub{margin:0 0 18px;color:#8e8e93;font-size:14px}
.sh label.f{display:grid;gap:6px;font-size:13px;color:#8e8e93;margin-bottom:12px}
.in{width:100%;min-width:0;background:#2c2c2e;border:0;border-radius:12px;padding:12px 14px;color:#f2f2f7;font-size:16px}
.in:focus{outline:2px solid #0a84ff;outline-offset:0}
textarea.in{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font:600 16px/1 var(--ios);cursor:pointer;background:#2c2c2e;color:#f2f2f7;transition:transform .15s cubic-bezier(.3,.7,.4,1.4),background .15s}
.ib:active{transform:scale(.96)} .ib:hover{background:#3a3a3c}
.ib.blue{background:#0a84ff;color:#fff} .ib.blue:hover{background:#2b95ff}
.ib.red{background:rgba(255,69,58,.16);color:#ff6961} .ib.red:hover{background:rgba(255,69,58,.26)}
.ib.green{background:#30d158;color:#04230d}
.ib.full{width:100%}
.ib svg{width:19px;height:19px}
.ib:disabled{opacity:.4;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--seg-bg,rgba(255,255,255,.08))}
.seg button,.seg a{border:0;background:transparent;color:var(--seg-fg,#c7c7cc);font:600 14px/1 var(--ios);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--seg-on,#636366);color:var(--seg-onfg,#fff);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.seg small{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.qa-poster{width:120px;border-radius:12px;background:#2c2c2e;cursor:pointer;flex:none}
.qa-poster .ph{color:#8e8e93;font:500 12px/1.3 var(--ios)}
.qa-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.qa-top > div:last-child{flex:1;min-width:0}

/* ===== STEAM / ИГРЫ ===== */
body[data-theme="games"]{background:var(--s-bg);color:var(--s-fg);font-family:var(--s-body)}
body[data-theme="games"]::before{background:var(--s-top)}
.s-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--s-top) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--s-line)}
.s-top-in{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:66px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s-logo{font-family:var(--s-display);font-weight:700;font-size:26px;letter-spacing:.08em;color:#fff;white-space:nowrap;display:flex;align-items:center;gap:10px}
.s-logo i{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,transparent 19%),radial-gradient(circle,#5a5a63 0 55%,#2a2a2f 56%)}
.s-search{position:relative;flex:1 1 200px;max-width:300px;min-width:0;margin-left:auto}
.s-search input{width:100%;background:var(--s-panel2);border:1px solid var(--s-line);border-radius:12px;padding:9px 36px 9px 14px;color:#fff}
.s-search input::placeholder{color:var(--s-dim)}
.s-search input:focus{outline:none;border-color:#55555e}
.s-search svg{position:absolute;right:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--s-dim);pointer-events:none}
body[data-theme="games"] .seg{--seg-bg:var(--s-panel);--seg-on:var(--s-acc);--seg-onfg:var(--s-accfg)}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-family:var(--s-body);font-weight:600;font-size:15px;color:var(--s-accfg);background:var(--s-acc);white-space:nowrap;transition:transform .15s cubic-bezier(.3,.7,.4,1.4),background .15s}
.s-btn:hover{filter:brightness(1.08)} .s-btn:active{transform:scale(.96)}
.s-btn.dark{background:var(--s-panel2);color:var(--s-fg);border:1px solid var(--s-line)} .s-btn.dark:hover{background:#2a2a2f;color:#fff}
.s-btn.green{background:var(--st-done);color:#04230d} .s-btn.green:hover{background:#4ee173}
.s-btn.red{background:rgba(255,69,58,.14);color:#ff6961} .s-btn.red:hover{background:rgba(255,69,58,.24)}
.s-btn.hot{background:linear-gradient(135deg,#ff3b30,#ff9f0a);color:#fff;box-shadow:0 6px 20px rgba(255,80,40,.3)}
.s-btn svg{width:18px;height:18px}
.s-main{max-width:1300px;margin:0 auto;padding-top:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.s-h1{margin:0;font-family:var(--s-display);font-weight:600;font-size:clamp(30px,4vw,42px);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.s-stats{display:flex;gap:6px;flex-wrap:wrap}
.s-stat{background:var(--s-panel);border:1px solid var(--s-line);border-radius:14px;padding:10px 16px;min-width:96px}
.s-stat b{display:block;font-family:var(--s-display);font-size:28px;font-weight:600;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.s-stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--s-dim)}
.s-stat.blue b{color:var(--st-play)} .s-stat.green b{color:var(--st-done)} .s-stat.red b{color:var(--st-drop)}
.s-shelf-h{margin:30px 0 12px;font-family:var(--s-display);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:12px}
.s-shelf-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--s-line),transparent)}
.s-row{display:grid;grid-auto-flow:column;grid-auto-columns:160px;gap:16px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.s-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:26px}
.s-sel{margin-left:auto;background:var(--s-panel2);border:1px solid var(--s-line);border-radius:10px;padding:8px 10px;color:var(--s-fg);font-size:14px}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 16px;margin-top:20px}
.s-card{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left;color:inherit}
body[data-theme="games"] .poster{border-radius:14px;background:linear-gradient(180deg,#26262b,#16161a);box-shadow:0 6px 16px rgba(0,0,0,.5);transition:transform .2s cubic-bezier(.3,.7,.4,1.3),box-shadow .2s}
body[data-theme="games"] .poster .ph{font-family:var(--s-display);font-size:21px;text-transform:uppercase;color:#7c7c86;letter-spacing:.02em}
.s-card:hover .poster{transform:translateY(-4px) scale(1.02);box-shadow:0 0 0 2px #55555e,0 14px 30px rgba(0,0,0,.65)}
.s-card:active .poster{transform:scale(.97)}
.s-card .t{margin-top:9px;color:#fff;font-weight:600;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-card .m{margin-top:4px;font-size:13px;color:var(--s-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.s-flag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.s-flag.playing{background:rgba(78,161,255,.16);color:#7db9ff} .s-flag.done{background:rgba(48,209,88,.16);color:#5fe07f} .s-flag.dropped{background:rgba(255,69,58,.16);color:#ff7b72}
.s-empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--s-dim);background:var(--s-panel);border:1px dashed var(--s-line);border-radius:18px}
.s-empty b{display:block;color:#fff;font-family:var(--s-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.s-src{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.s-srcb{position:relative;display:flex;align-items:center;gap:14px;cursor:pointer;border:1px solid var(--s-line);background:var(--s-panel);padding:14px 16px;border-radius:18px;text-align:left;color:var(--s-fg);overflow:hidden;transition:border-color .15s,transform .2s cubic-bezier(.3,.7,.4,1.4)}
.s-srcb:hover{border-color:#44444b} .s-srcb:active{transform:scale(.98)}
.s-srcb .lg{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#0b0b0c;color:#c9c9d1}
.s-srcb .lg svg{width:28px;height:28px}
.s-srcb b{display:block;font-family:var(--s-display);font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:#fff;line-height:1}
.s-srcb small{color:var(--s-dim);font-size:13px}
.s-srcb[aria-pressed="true"]{border-color:#8e8e97;background:linear-gradient(135deg,#26262b,#18181b)}
.s-srcb[aria-pressed="true"] .lg{background:var(--s-acc);color:#0e0e10}
.s-srcb.pirate[aria-pressed="true"]{border-color:#c9963e;background:linear-gradient(135deg,#2e2414,#16130e)}
.s-srcb.pirate[aria-pressed="true"] .lg{background:#d6a24a;color:#1a1208}
.s-srcb .bigc{position:absolute;right:-6px;bottom:-18px;font-family:var(--s-display);font-size:64px;font-weight:700;color:rgba(255,255,255,.05);pointer-events:none}
@media (max-width:640px){.s-src{grid-template-columns:1fr}}
/* контракт-баннер */

}

/* ===== Apple-страницы ===== */

.a-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--c-ring);color:#fff;font:600 14px/1 var(--ios);cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.4)}

.a-btn.gray{background:var(--c-cell-out);color:var(--c-fg)}
.a-link{border:0;background:none;color:var(--c-ring);font:500 15px/1 var(--ios);cursor:pointer;padding:6px 8px;border-radius:8px}

.a-empty{padding:40px 20px;text-align:center;color:var(--c-dim);background:var(--c-cell);border-radius:20px;box-shadow:var(--c-shadow)}

/* скоро */
.so-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}
.so{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:20px;background:var(--c-cell);box-shadow:var(--c-shadow);cursor:pointer;text-align:left;border:0;color:inherit;transition:transform .2s cubic-bezier(.3,.7,.4,1.3)}

.so h4{margin:2px 0 4px;font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.01em}

/* ещё */

.mo-row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border:0;background:none;color:inherit;text-align:left;font:500 16px/1.2 var(--ios);cursor:pointer;text-decoration:none;transition:background .15s}

.rc-hero{margin-top:18px;padding:34px 28px;border-radius:28px;background:radial-gradient(120% 120% at 0% 0%,#ff375f 0%,transparent 55%),radial-gradient(120% 120% at 100% 100%,#5e5ce6 0%,transparent 60%),#16161a;color:#fff;overflow:hidden}

.rc-g .n{text-align:right;color:var(--c-dim);font-variant-numeric:tabular-nums}

.fr-pct.hi{background:rgba(48,209,88,.18);color:#30d158}.fr-pct.mid{background:rgba(255,214,10,.18);color:#d6a700}.fr-pct.lo{background:rgba(255,69,58,.16);color:#ff453a}

.fd-row .r.green{background:var(--r-green);color:#04230d}.fd-row .r.yellow{background:var(--r-yel);color:#1d1d1f}.fd-row .r.red{background:var(--r-red);color:#fff}
.up-head{display:flex;align-items:center;gap:18px;margin-top:6px}

.fr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-top:12px}

.fr-card .poster .ph{font-size:13px;color:var(--c-dim);padding:8px}
.fr-card .t{margin-top:7px;font-weight:600;font-size:14px;line-height:1.25}
.fr-card .m{margin-top:2px;font-size:12.5px;color:var(--c-dim)}

.fr-h{margin:26px 0 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.fr-h small{color:var(--c-dim);font-weight:500;margin-left:6px}
.cmp-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}

.cmp-row b{flex:none;width:40px;text-align:center;font-variant-numeric:tabular-nums}

.cmp-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

.rc-sec .a-btn svg{width:18px;height:18px;flex:none}
.cr-box{text-align:center;padding:6px 0 2px}
.cr-box .poster{width:150px;margin:0 auto;border-radius:14px;background:var(--c-cell-out);transition:transform .2s}
.cr-box .poster .ph{font-size:14px;color:var(--c-dim);padding:10px}
.cr-box .t{margin-top:12px;font-size:22px;font-weight:700;letter-spacing:-.01em;min-height:28px}
.cr-box .w{margin-top:4px;color:var(--c-dim);font-size:14px;min-height:18px}
.cr-box.spin .poster{transform:scale(.94)}
.cr-box.win .poster{animation:crWin .5s cubic-bezier(.3,.7,.4,1.5)}
@keyframes crWin{0%{transform:scale(.8)}100%{transform:scale(1)}}
.dr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;margin-top:20px}
.dr{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.dr .poster{border-radius:16px;background:#2c2c2e}
.dr .poster img{filter:grayscale(1) contrast(1.1) brightness(.7)}
.dr .poster .ph{color:#8e8e93;font-size:14px}
.dr .stamp{position:absolute;left:50%;top:44%;z-index:2;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid #ff453a;color:#ff453a;font:800 30px/1 var(--ios);letter-spacing:.08em;padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.35);text-transform:uppercase}
.dr .t{margin-top:10px;font-weight:600;font-size:15px}

/* календарь */
.c-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.c-arrows{display:flex;align-items:center;gap:4px;margin-left:auto}
.c-arrows button{cursor:pointer;border:0;background:transparent;color:var(--c-ring);font:500 15px/1 var(--ios);padding:6px 10px;border-radius:8px}

.c-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin:14px 0 22px;color:var(--c-dim);font-size:14px}
.c-sum b{color:var(--c-fg);font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.c-sum .k{display:inline-flex;align-items:center;gap:6px}

.c-dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:8px}
.c-dows div{font-size:12px;font-weight:600;color:var(--c-dim);text-transform:uppercase;letter-spacing:.04em;padding-left:4px}
.c-dows div:nth-child(n+6){color:var(--r-red);opacity:.85}
.c-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.c-day{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:16px;background:var(--c-cell);box-shadow:var(--c-shadow);overflow:hidden;min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.c-day.out{background:var(--c-cell-out);box-shadow:none;opacity:.55}
.c-day.today{box-shadow:0 0 0 2.5px var(--c-ring),var(--c-shadow)}
.c-day.over{box-shadow:0 0 0 3px var(--c-ring);transform:scale(1.05)}
.c-num{position:absolute;top:7px;left:9px;z-index:3;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--c-fg);pointer-events:none}
.c-day.today .c-num{color:var(--c-ring)}
.c-day.has .c-num{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}

.c-t{position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;background:#2c2c2e;border-radius:13px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}

.c-t::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inherit;z-index:3;pointer-events:none}

.c-t.game .nm{background:linear-gradient(160deg,#1f4a7a,#0f2540)} .c-t.kino .nm{background:linear-gradient(160deg,#7a4a12,#3d230a)}
.c-t::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 38%,transparent 62%,rgba(0,0,0,.35));pointer-events:none}
.c-t.rel{outline:2px dashed rgba(255,255,255,.85);outline-offset:-5px}
.c-t.rel img{filter:saturate(.6) brightness(.8)}
.c-relb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 6px;border-radius:6px}
.c-kind{position:absolute;left:6px;bottom:6px;z-index:2;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff}
.c-kind svg{width:14px;height:14px}
.c-t.game .c-kind{color:#8ec5ff} .c-t.kino .c-kind{color:#ffc46b}
.c-tiles.n3 .c-t:not(:first-child) .c-kind,.c-tiles.n4 .c-kind{width:17px;height:17px;left:4px;bottom:4px;border-radius:5px}
.c-tiles.n3 .c-t:not(:first-child) .c-kind svg,.c-tiles.n4 .c-kind svg{width:11px;height:11px}
.c-rate{position:absolute;right:6px;bottom:6px;z-index:2;min-width:24px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

.c-tgt{position:absolute;right:5px;top:5px;z-index:2;width:16px;height:16px}
.c-tiles.n3 .c-t:not(:first-child) .c-rate,.c-tiles.n4 .c-rate{min-width:18px;height:16px;font-size:10px;padding:0 4px;right:4px;bottom:4px}
.c-more{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:15px;pointer-events:none}
.ghost{position:fixed;z-index:96;width:84px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:translate(-50%,-60%) rotate(-4deg) scale(1.05);background:#2c2c2e}
.ghost img{width:100%;height:100%;object-fit:cover}
.ghost .nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;color:#fff;font:600 12px/1.2 var(--ios)}
.c-tip{margin-top:18px;font-size:13px;color:var(--c-dim)}
@media (max-width:640px){
  .c-grid,.c-dows{gap:5px}.c-day{border-radius:10px}
  .c-num{top:4px;left:5px;font-size:11px}
  .c-rate{min-width:18px;height:15px;font-size:9.5px;padding:0 4px;right:3px;bottom:3px}
  .c-kind{left:3px;bottom:3px;width:15px;height:15px;border-radius:5px}.c-kind svg{width:10px!important;height:10px!important}.c-tiles{gap:2px;padding:2px}.c-t{border-radius:8px}
  .c-t .nm,.c-relb{display:none}
  .c-tiles.n3 .c-rate,.c-tiles.n4 .c-rate,.c-tiles.n2 .c-rate{display:none}
}

/* ===== рулетка ===== */
.rl{position:fixed;inset:0;z-index:78;overflow-y:auto;color:#fff;font-family:var(--ios);background:#050507}
.rl-bg{position:fixed;inset:-20%;background:conic-gradient(from 0deg at 50% 50%,#ff375f22,#5e5ce622,#0a84ff22,#ff9f0a22,#ff375f22);filter:blur(60px);animation:spinbg 18s linear infinite;pointer-events:none}
@keyframes spinbg{to{transform:rotate(360deg)}}
.rl-x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;cursor:pointer;display:grid;place-items:center}
.rl-x svg{width:18px;height:18px}
.rl-in{position:relative;max-width:1200px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top,0px)) 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.rl-kicker{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ff9f0a}
.rl-h{margin:8px 0 6px;font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1}
.rl-sub{margin:0 0 30px;color:rgba(255,255,255,.6)}
.rl-win{position:relative;height:330px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.rl-strip{position:absolute;left:0;top:30px;display:flex;gap:16px;will-change:transform}
.rl-t{flex:none;width:170px;transition:transform .5s cubic-bezier(.2,.9,.25,1.3),opacity .5s,filter .5s}
.rl-t .poster{border-radius:16px;background:#1c1c1e;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rl-t .poster .ph{color:#8e8e93;font-size:15px}
.rl-t .tt{margin-top:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-strip.done .rl-t{opacity:.25;filter:grayscale(.8) blur(1px)}
.rl-strip.done .rl-t.win{opacity:1;filter:none;transform:scale(1.14)}
.rl-strip.done .rl-t.win .poster{box-shadow:0 0 0 3px #fff,0 0 60px 10px rgba(255,159,10,.55),0 20px 50px rgba(0,0,0,.6)}
.rl-mark{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;z-index:3;border-radius:2px;background:linear-gradient(180deg,transparent,#fff 15%,#fff 85%,transparent);box-shadow:0 0 18px 3px rgba(255,255,255,.6)}
.rl-mark::before,.rl-mark::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:10px solid transparent}
.rl-mark::before{top:0;border-top-color:#fff} .rl-mark::after{bottom:0;border-bottom-color:#fff}
.rl-mark.tick{animation:tick .12s ease-out}
@keyframes tick{50%{transform:scaleX(1.8)}}
.rl-acts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:20px;padding:0 16px}
.rl-go{position:relative;border:0;border-radius:999px;padding:18px 54px;font:800 20px/1 var(--ios);letter-spacing:.02em;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff375f,#ff9f0a);box-shadow:0 10px 40px rgba(255,80,60,.45);transition:transform .2s cubic-bezier(.3,.7,.4,1.5)}
.rl-go:hover{transform:scale(1.04)} .rl-go:active{transform:scale(.95)}
.rl-go:disabled{opacity:.4;cursor:default;transform:none}
.rl-go.ghostb{background:rgba(255,255,255,.12);box-shadow:none}
.rl-res{min-height:120px;margin-top:20px;padding:0 16px}
.rl-res h3{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;animation:pop .5s cubic-bezier(.2,.9,.25,1.4)}
.rl-res p{margin:6px 0 0;color:rgba(255,255,255,.65)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
.rl-cf{position:fixed;inset:0;pointer-events:none;z-index:6}
@media (max-width:640px){.rl-win{height:240px}.rl-t{width:120px}.rl-go{padding:16px 40px}}

/* ===== тир-лист ===== */
.tier{position:fixed;inset:0;z-index:60;overflow-y:auto;background:#0b0b0d;color:#f2f2f7;font-family:var(--ios);animation:inF .2s ease}
.tier-in{max-width:1200px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tier-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tier-h h2{margin:0;font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
.tier-h p{margin:0;color:#8e8e93;font-size:14px;flex-basis:100%}
.tr{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:124px;border-radius:16px;overflow:hidden;background:#1c1c1e;margin-bottom:8px}
.tl{display:grid;place-items:center;font-size:34px;font-weight:800;color:#111}
.tz{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start;min-height:124px;transition:background .15s}
.tz.over{background:#2c2c2e}
.tt{width:72px;cursor:grab;touch-action:none;user-select:none;transition:transform .15s}
.tt:active{cursor:grabbing}
.tt .poster{border-radius:10px;background:#2c2c2e}
.tier .tt .poster .ph{font-size:10px;letter-spacing:0;color:#8e8e93;padding:4px;font-family:var(--ios);text-transform:none}
.tt .rb{top:4px;left:4px;min-width:24px;height:18px;font-size:11px;padding:0 5px}
.tt .tgt,.tt .src-chip{display:none}
.tt.lift{opacity:.25}
.tr.pool{background:#141416;border:1px dashed #3a3a3c}
.tr.pool .tl{color:#8e8e93;font-size:13px;font-weight:600;background:#1c1c1e;text-align:center;padding:4px}
@media (max-width:640px){.tr{grid-template-columns:52px minmax(0,1fr)}.tl{font-size:26px}.tt{width:58px}}

/* ===== медаль, кровавый прицел, таймер ===== */
.medal,.blood{position:absolute;top:6px;left:6px;z-index:2;width:34px;height:40px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.medal svg,.blood svg{width:100%;height:100%;overflow:visible}
.blood .drip{animation:drip 2.8s ease-in infinite;transform-origin:top}
.blood .drip.d2{animation-delay:1.1s}.blood .drip.d3{animation-delay:1.9s}
@keyframes drip{0%{transform:scaleY(.2);opacity:0}15%{opacity:1}70%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1.15) translateY(3px);opacity:0}}
.rb.bl{top:auto;bottom:8px}
.tier .medal,.tier .blood{width:22px;height:26px;top:3px;left:auto;right:3px}
.tmr{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--s-dim);font-variant-numeric:tabular-nums}
.tmr svg{width:13px;height:13px}
.tmr.run{color:#7db9ff}
.s-timer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--s-bg2);border-radius:16px;padding:14px 16px}
.s-timer .n{font-family:var(--s-display);font-size:52px;font-weight:700;line-height:.9;color:#fff;font-variant-numeric:tabular-nums}
.s-timer .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--s-dim)}
.s-timer .tx{font-size:15px;color:var(--s-fg);margin-top:2px}
.s-timer.run .n{color:#7db9ff}.s-timer.done .n{color:#f5c542}.s-timer.dropped .n{color:var(--st-drop)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7db9ff;margin-right:6px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25;transform:scale(.7)}}

/* ===== свечение статусов, бесконечные, жанры, релизы ===== */
.s-card.st-done .poster{box-shadow:0 26px 34px -16px rgba(48,209,88,.75),0 6px 16px rgba(0,0,0,.5)}
.s-card.st-dropped .poster{box-shadow:0 26px 34px -16px rgba(255,59,48,.8),0 6px 16px rgba(0,0,0,.5)}
.s-card.st-endless .poster{box-shadow:0 26px 34px -16px rgba(191,90,242,.7),0 6px 16px rgba(0,0,0,.5)}
.s-card.st-done:hover .poster{box-shadow:0 0 0 2px rgba(48,209,88,.8),0 26px 40px -14px rgba(48,209,88,.8)}
.s-card.st-dropped:hover .poster{box-shadow:0 0 0 2px rgba(255,69,58,.8),0 26px 40px -14px rgba(255,59,48,.85)}
.s-card.st-endless:hover .poster{box-shadow:0 0 0 2px rgba(191,90,242,.8),0 26px 40px -14px rgba(191,90,242,.8)}
.medal.inf{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#bf5af2,#5e5ce6);color:#fff;font:700 24px/1 var(--ios);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.s-flag.endless{background:rgba(191,90,242,.18);color:#d69cff}
.s-stat.purple b{color:#bf5af2}
.chips button[aria-pressed="true"].endless{background:#bf5af2;border-color:#bf5af2;color:#fff}
.s-pricebox .st.endless{background:#bf5af2;color:#fff}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gchips button{border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-dim);border-radius:999px;padding:6px 12px;font:600 13px/1 var(--s-body);cursor:pointer;text-transform:none;letter-spacing:0;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),background .15s,color .15s}
.gchips button:hover{color:#fff;border-color:#55555e}.gchips button:active{transform:scale(.93)}
.gchips button[aria-pressed="true"]{background:var(--s-acc);color:var(--s-accfg);border-color:var(--s-acc)}
.rel-prec{display:grid;gap:8px;justify-items:start}
.rel-prec input{max-width:260px}
.k-sec{display:flex;align-items:center;gap:14px;margin:38px 0 0}
.k-sec h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.k-sec span{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--k-dim);font-variant-numeric:tabular-nums}
.k-sec i{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
.k-sec + .k-grid{margin-top:16px}

/* ===== компактные источники ===== */
.src-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src-p{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--s-line);background:transparent;color:var(--s-dim);border-radius:999px;padding:5px 12px 5px 10px;font:600 13px/1 var(--s-body);cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),color .15s,background .15s}
.src-p:hover{color:#fff;border-color:#55555e}.src-p:active{transform:scale(.94)}
.src-p .i{display:inline-flex;width:16px;height:16px}.src-p .i svg{width:100%;height:100%}
.src-p small{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.src-p[aria-pressed="true"]{background:var(--s-acc);color:var(--s-accfg);border-color:var(--s-acc)}
.src-p.pirate[aria-pressed="true"]{background:#d6a24a;border-color:#d6a24a;color:#1a1208}
.rel .dd.editable{cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),box-shadow .15s}
.rel .dd.editable:hover{box-shadow:0 0 0 2px rgba(255,255,255,.5)}.rel .dd.editable:active{transform:scale(.92)}
.rel-in{display:flex;flex-wrap:wrap;gap:8px}
.rel-in input,.rel-in select{max-width:200px}

/* ===== колесо оценки ===== */
.s-rate{background:var(--s-bg2);border-radius:16px;padding:14px 16px}
.s-rate .lb,.k-rate .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--s-dim);margin-bottom:10px}
.k-rate{margin-top:20px;max-width:560px}
.k-rate .lb{color:var(--k-dim)}
.rw-wrap{display:grid;gap:8px}
.rw{position:relative;height:64px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.rw-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;touch-action:pan-x;user-select:none}
.rw-track::-webkit-scrollbar{display:none}
.rw-track.drag{cursor:grabbing;scroll-snap-type:none}
.rw-pad{flex:none;width:calc(50% - 30px)}
.rw-i{flex:none;width:60px;height:100%;display:grid;place-items:center;scroll-snap-align:center;font:600 20px/1 var(--ios);color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums;transition:color .15s,transform .2s cubic-bezier(.3,.7,.4,1.4)}
.rw-i.half{font-size:14px}
.rw-i.on{color:#fff;transform:scale(1.35)}
.rw-i.on.red{color:var(--r-red)}.rw-i.on.yellow{color:var(--r-yel)}.rw-i.on.green{color:var(--r-green)}
.rw-mark{position:absolute;left:50%;top:8px;bottom:8px;width:60px;margin-left:-30px;border-radius:12px;border:2px solid rgba(255,255,255,.55);pointer-events:none;transition:border-color .2s}
.rw-mark.red{border-color:var(--r-red)}.rw-mark.yellow{border-color:var(--r-yel)}.rw-mark.green{border-color:var(--r-green)}
.rw-out{font:600 14px/1.2 var(--ios);color:rgba(255,255,255,.6);text-transform:none;letter-spacing:0}
.rw-out b{font-size:16px}
.rw-out .red{color:var(--r-red)}.rw-out .yellow{color:var(--r-yel)}.rw-out .green{color:var(--r-green)}

/* ===== календарь выходов в разделах (в духе Steam) ===== */
.rel-box{margin-top:22px;border-radius:20px;padding:16px;background:var(--rel-bg,var(--s-panel));border:1px solid var(--rel-line,var(--s-line))}
.rel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rel-h h3{margin:0;font:600 15px/1 var(--rel-font,var(--s-display));letter-spacing:.12em;text-transform:uppercase;color:#fff}
.rel-h small{color:var(--rel-dim,var(--s-dim));font-size:13px}
.rel-list{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,340px);gap:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.rel{display:grid;grid-template-columns:54px 50px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--rel-card,rgba(255,255,255,.04));border:0;color:inherit;text-align:left;cursor:pointer;transition:transform .2s cubic-bezier(.3,.7,.4,1.3),background .15s}
.rel:hover{background:var(--rel-hover,rgba(255,255,255,.08))} .rel:active{transform:scale(.97)}
.rel .dd{display:grid;place-items:center;align-content:center;height:62px;border-radius:10px;background:var(--rel-date,#000);color:#fff;text-align:center}
.rel .dd small{font:700 11px/1 var(--ios);letter-spacing:.08em;text-transform:uppercase;color:var(--rel-acc,#ff6961)}
.rel .dd b{font:700 26px/1 var(--ios);margin-top:3px;font-variant-numeric:tabular-nums}
.rel .poster{width:50px;border-radius:7px;box-shadow:none!important}
.rel .poster .ph{font-size:9px!important;padding:3px}
.rel h4{margin:0;font:600 15px/1.2 var(--rel-font2,var(--s-body));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .g{font-size:12px;color:var(--rel-dim,var(--s-dim));margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .cd{display:inline-block;margin-top:5px;font:700 12px/1 var(--ios);padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-variant-numeric:tabular-nums}
.rel .cd.now{background:var(--r-green);color:#04230d}
.rel-empty{color:var(--rel-dim,var(--s-dim));font-size:14px;padding:6px 2px}
body[data-theme="kino"] .rel-box{--rel-bg:rgba(255,255,255,.05);--rel-line:rgba(255,255,255,.1);--rel-dim:var(--k-dim);--rel-font:var(--k-ui);--rel-font2:var(--k-ui);--rel-acc:var(--k-gold);--rel-date:#14141f}
@media (max-width:640px){.rel-list{grid-auto-columns:86%}}

/* ===== плитки «Ещё» в стиле Metro ===== */
.bk{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 12px 12px 14px;border-radius:16px;background:rgba(48,209,88,.10);border:1px solid rgba(48,209,88,.28)}
.bk.warn{background:rgba(255,159,10,.12);border-color:rgba(255,159,10,.4)}
.bk-ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:#30d158;color:#04210d}
.bk.warn .bk-ic{background:#ff9f0a;color:#2a1700}
.bk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bk-t b{font-size:15px;font-weight:650}.bk-t small{font-size:12.5px;color:var(--c-dim);line-height:1.3}
.bk .ib{flex:none;white-space:nowrap}
@media (max-width:520px){.bk{flex-wrap:wrap}.bk .ib{width:100%}}
.mt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.mt{position:relative;aspect-ratio:1/1;border:0;border-radius:10px;padding:16px;color:#fff;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s cubic-bezier(.3,.7,.4,1.3),box-shadow .2s;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.mt.wide{grid-column:span 2;aspect-ratio:auto}
.mt:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.mt:active{transform:perspective(600px) rotateX(4deg) scale(.97)}
.mt .ic{width:54px;height:54px}
.mt .ic svg{width:100%;height:100%;stroke-width:1.6}
.mt .lb{font:600 16px/1.2 var(--ios)}
.mt .lb small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}

  function parseKP(txt){
    const lines = txt.split(/\r?\n/).map(l => l.replace(/[ \t ]+/g, " ").trim()).filter(Boolean), out = {};
    const LBL = {"год производства":"year","страна":"country","жанр":"genre","слоган":"tagline","режиссер":"director","режиссёр":"director","сценарий":"writer","продюсер":"producer",

    const KEYS = Object.keys(LBL).sort((a,b) => b.length - a.length);
    const IGN = ["художник","монтаж","сборы в сша","сборы в россии","цифровой релиз","рейтинг mpaa","о фильме","о сериале","в главных ролях","роли дублировали","сиквелы","трейлер","добавить в папку","буду смотреть","оценить","рейтинг фильма","в списках","обзор","нашли ошибку","добавить инфо"];
    const labelOf = l => { const low = l.toLowerCase(); for (const k of KEYS) if (low === k || low.startsWith(k + " ") || low.startsWith(k + ":")) return [k, l.slice(k.length).replace(/^[:\s]+/, "")]; return null; };
    const isIgn = l => { const low = l.toLowerCase(); return IGN.some(k => low.startsWith(k)); };
    const clean = (v, key) => {
      v = v.replace(/,?\s*(\.\.\.|…)\s*$/, "").replace(/\s+слова$/i, "").replace(/\s+сборы$/i, "").trim();
      if (key === "boxWorld" && v.includes("=")) v = v.split("=").pop().trim();
      if (key === "premiereWorld" || key === "premiereRu") v = v.split(/,\s*[«"]/)[0].replace(/,\s*$/, "").trim();
      if (key === "year"){ const m = v.match(/\d{4}/); v = m ? +m[0] : null; }
      if (key === "tagline") v = v.replace(/^[«"]|[»"]$/g, "");
      return v;
    };
    let firstLabel = lines.length;
    lines.forEach((l, i) => { const m = labelOf(l); if (!m) return; firstLabel = Math.min(firstLabel, i);
      let v = m[1]; if (!v && lines[i+1] && !labelOf(lines[i+1]) && !isIgn(lines[i+1])) v = lines[i+1];
      if (v && out[LBL[m[0]]] == null){ const c = clean(v, LBL[m[0]]); if (c) out[LBL[m[0]]] = c; } });

    if (head[0]){ const m = head[0].match(/^(.+?)\s*\((\d{4})(?:\s*[–-]\s*(?:\d{4}|\.\.\.))?\)\s*$/); out.title = m ? m[1] : head[0]; if (m && !out.year) out.year = +m[2]; }

      if (/[A-Za-z]/.test(name) && name.length < 80 && !/\d[.,]\d/.test(name)) out.originalTitle = name; }
    if (!out.age){ const a = lines.find(l => /^\d{1,2}\+$/.test(l)); if (a) out.age = a; }
    const kp = lines.find(l => /^\d[.,]\d{1,2}$/.test(l)); if (kp) out.kpRating = parseFloat(kp.replace(",", "."));
    const sh = head.slice(1).find(l => l.length >= 40 && l.length <= 300 && l !== out.originalTitle); if (sh) out.short = sh;
    const ds = lines.filter(l => l.length > 150 && !labelOf(l)).sort((a,b) => b.length - a.length)[0]; if (ds && ds !== out.short) out.desc = ds;
    const sm = txt.match(/(\d+)\s+сезон/i); if (sm) out.seasons = +sm[1];

      if (cast.length) out.cast = cast.join(", "); }
    Object.keys(out).forEach(k => { if (out[k] == null || out[k] === "") delete out[k]; });

  }

  function parseSteam(txt){
    const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean), out = {};
    const after = re => { for (let i = 0; i < lines.length; i++){ const m = lines[i].match(re); if (m){ const v = (m[1] || "").trim(); return v || (lines[i+1] || "").trim(); } } return ""; };
    out.title = after(/^(?:название|title)\s*:\s*(.*)$/i);
    if (!out.title){ const crumb = lines.find(l => /^(все игры|all games)\s*>/i.test(l)); if (crumb) out.title = crumb.split(">").pop().trim(); }
    out.genre = after(/^(?:жанры?|genres?)\s*:?\s*(.*)$/i) || after(/^(?:метки|популярные метки|теги|tags)\s*:?\s*(.*)$/i);

    out.release = after(/^(?:дата выхода|release date)\s*:?\s*(.*)$/i);
    if (/(бесплатно|free to play)/i.test(txt)) out.free = true;

    if (rub) out.rub = +rub[1].replace(/\D/g, ""); else if (kzt) out.kzt = +kzt[1].replace(/\D/g, "");

    const desc = lines.filter(l => l.length > 60 && !label.test(l)).sort((a,b) => b.length - a.length)[0];

  function dragger(root, {canStart, onDrop, onClick, zoneSel}){
    let st = null, ghost = null, over = null;
    root.addEventListener("pointerdown", e => {
      const t = e.target.closest("[data-drag]"); if (!t || e.button > 0) return;
      st = {id: t.dataset.drag, el: t, x: e.clientX, y: e.clientY, moved: false};
      t.setPointerCapture(e.pointerId);
    });
    root.addEventListener("pointermove", e => {
      if (!st) return;
      if (!st.moved){
        if (Math.hypot(e.clientX - st.x, e.clientY - st.y) < 6 || !canStart()) return;
        st.moved = true; st.el.classList.add("lift");
        const it = items.find(i => i.id === st.id);
        ghost = document.createElement("div"); ghost.className = "ghost";
        ghost.innerHTML = it && it.cover ? `<img alt="" src="${blobUrl(it.cover)}" style="${posStyle(it.coverPos)}">` : `<div class="nm">${esc(it ? it.title : "")}</div>`;
        document.body.appendChild(ghost);
      }
      ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
      const el = document.elementFromPoint(e.clientX, e.clientY), z = el && el.closest ? el.closest(zoneSel) : null;
      if (z !== over){ over && over.classList.remove("over"); over = z; over && over.classList.add("over"); }
    });
    const end = e => {
      if (!st) return; const s = st; st = null;
      s.el.classList.remove("lift"); if (ghost){ ghost.remove(); ghost = null; }
      const z = over; over && over.classList.remove("over"); over = null;
      if (!s.moved){ if (e.type === "pointerup" && onClick) onClick(s.id); return; }
      if (z) onDrop(s.id, z, e);
    };
    root.addEventListener("pointerup", end);
    root.addEventListener("pointercancel", end);
  }

  function spin(S){
    const pool = S.pool();

    let win = cands[Math.floor(Math.random() * cands.length)]; S.last = win;
    const N = 64, W = 56, seq = [];
    for (let i = 0; i < N; i++) seq.push(pool[Math.floor(Math.random() * pool.length)]);

      if ($("rlChips")) $("rlChips").innerHTML = S.temps.map(x => `<span>${esc(x.title)}<button type="button" data-rm="${esc(x.id)}" aria-label="Убрать">×</button></span>`).join("");

  function confetti(){
    const cv = $("rlCf") || (() => { const c = document.createElement("canvas"); c.className = "rl-cf"; c.style.zIndex = 98; document.body.appendChild(c); setTimeout(() => c.remove(), 2600); return c; })();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cols = ["#ff375f","#ff9f0a","#ffd60a","#30d158","#0a84ff","#bf5af2","#ffffff"];
    const ps = Array.from({length:160}, () => ({x: W/2, y: H*.45, vx: (Math.random()-.5)*16, vy: -Math.random()*15-4, r: Math.random()*6+3, c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*6, va: (Math.random()-.5)*.4}));
    const t0 = performance.now();
    const f = t => { const e = t - t0; ctx.clearRect(0,0,W,H);
      ps.forEach(p => { p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - e/2200); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); });
      if (e < 2300) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H); };
    requestAnimationFrame(f);
  }

  const extMime = p => MIME[(p.split(".").pop() || "").toLowerCase()] || "image/png";
  const needZip = async () => { for (let i = 0; i < 50 && !window.JSZip; i++) await new Promise(r => setTimeout(r, 100)); if (!window.JSZip) throw new Error("nozip"); };
  function saveBlob(blob, name){
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();

  async function exportZip(onProg){
    await needZip();
    const zip = new JSZip(), ids = [...new Set(items.flatMap(imgIds))];

    const worker = async () => { while (i < ids.length){ const id = ids[i++];

      done++; onProg && onProg(done, ids.length); } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    zip.file("nexus.json", JSON.stringify({nexus: 2, nick: NICK, exportedAt: now(), items, theme}, null, 2));
    const blob = await zip.generateAsync({type: "blob", compression: "STORE"});
    saveBlob(blob, `${NICK}-nexus-${today()}.zip`);
    const info = {at: now(), items: items.length, files: ok, missing: ids.length - ok};

  async function importBackup(f, onProg){
    let j, zip = null;
    if (/\.zip$/i.test(f.name) || /zip/.test(f.type)){ await needZip(); zip = await JSZip.loadAsync(f); const jf = zip.file("nexus.json"); if (!jf) throw 0; j = JSON.parse(await jf.async("string")); }
    else j = JSON.parse(await f.text());
    const list = Array.isArray(j) ? j : j && j.items; if (!Array.isArray(list)) throw 0;
    const k = i => (i.title || "").toLowerCase() + "|" + i.type, have = new Set(items.map(k));
    const map = {}, mine = ME.id + "/";
    const remap = async id => {
      if (typeof id !== "string" || !id) return null; if (id in map) return map[id];
      let nid = null; const zf = zip && zip.file("media/" + id);
      if (zf){ try { const type = extMime(id); const b = await zf.async("blob"); nid = (await assets.upload(new Blob([b], {type}), {type})).id; } catch(e){} }
      else if (id.startsWith(mine)) nid = id; // картинка ещё лежит на сервере
      return map[id] = nid;
    };
    let n = 0, skip = 0, pics = 0, idx = 0;
    for (const raw of list){
      idx++; onProg && onProg(idx, list.length);
      const {id, ...body} = raw || {}; if (!body.title){ continue; } if (have.has(k(body))){ skip++; continue; }
      if (body.cover){ body.cover = await remap(body.cover); if (body.cover) pics++; else { delete body.cover; delete body.coverPos; } }
      if (body.wallpaper){ body.wallpaper = await remap(body.wallpaper); if (body.wallpaper) pics++; else delete body.wallpaper; }
      if (Array.isArray(body.shots)){ const out = []; for (const sId of body.shots){ const x = await remap(sId); if (x){ out.push(x); pics++; } } body.shots = out; } else delete body.shots;
      await db.collection("items").add(body); have.add(k(body)); n++;
    }
    return {n, skip, pics};
  }

  // ================= хранилище на Supabase =================
  const CFG = window.NEXUS_CONFIG || {};
  const publicUrl = path => `${String(CFG.SUPABASE_URL).replace(/\/$/, "")}/storage/v1/object/public/media/${String(path).split("/").map(encodeURIComponent).join("/")}`;
  function makeBackend(sb, uid){
    const map = new Map(), listeners = []; let loaded = false;
    const snap = () => ({metadata: {fromCache: !loaded, hasPendingWrites: false}, docs: [...map].map(([id, d]) => ({id, exists: true, data: () => d}))});
    const emit = () => listeners.forEach(f => { try { f(snap()); } catch(e){ console.error(e); } });
    async function loadAll(){
      const rows = []; let from = 0;
      for (;;){ const {data, error} = await sb.from("items").select("id,data").eq("user_id", uid).range(from, from + 999); if (error) throw error; rows.push(...data); if (data.length < 1000) break; from += 1000; }
      map.clear(); rows.forEach(r => map.set(r.id, r.data)); loaded = true; emit();
    }
    sb.channel("items-" + uid).on("postgres_changes", {event: "*", schema: "public", table: "items", filter: `user_id=eq.${uid}`}, p => {
      if (p.eventType === "DELETE"){ if (p.old && p.old.id) map.delete(p.old.id); } else if (p.new && p.new.id) map.set(p.new.id, p.new.data);
      emit();
    }).subscribe();
    const metaCache = {}, metaL = {};
    const metaNotify = key => (metaL[key] || []).forEach(fn => fn({exists: metaCache[key] != null, data: () => metaCache[key]}));
    const fail = e => ({code: "unavailable", message: (e && e.message) || String(e)});
    const db = {
      collection(name){
        return {
          onSnapshot(next, err){ listeners.push(next); if (loaded) next(snap()); else loadAll().catch(e => err && err(fail(e))); return () => {}; },
          async add(body){ const id = crypto.randomUUID(); map.set(id, body); emit();
            const {error} = await sb.from("items").insert({id, user_id: uid, data: body});
            if (error){ map.delete(id); emit(); throw fail(error); } return {id}; }
        };
      },
      doc(path){
        const [col, id] = path.split("/");
        if (col === "items") return {
          async get(){ const d = map.get(id); return {id, exists: !!d, data: () => d}; },
          async update(patch){ const cur = map.get(id); if (!cur) throw {code: "invalid_argument", message: "нет записи"};
            const next = {...cur, ...patch}; map.set(id, next); emit();
            const {error} = await sb.from("items").update({data: next, updated_at: new Date().toISOString()}).eq("id", id).eq("user_id", uid);
            if (error){ map.set(id, cur); emit(); throw fail(error); } },
          async delete(){ const cur = map.get(id); map.delete(id); emit();
            const {error} = await sb.from("items").delete().eq("id", id).eq("user_id", uid);
            if (error){ if (cur) map.set(id, cur); emit(); throw fail(error); } }
        };
        const key = id;
        return {
          async get(){ if (!(key in metaCache)){ const {data, error} = await sb.from("meta").select("data").eq("user_id", uid).eq("key", key).maybeSingle(); if (error) throw fail(error); metaCache[key] = data ? data.data : null; }
            return {exists: metaCache[key] != null, data: () => metaCache[key]}; },
          async set(d){ metaCache[key] = d; metaNotify(key); const {error} = await sb.from("meta").upsert({user_id: uid, key, data: d}); if (error) throw fail(error); },
          async delete(){ metaCache[key] = null; metaNotify(key); const {error} = await sb.from("meta").delete().eq("user_id", uid).eq("key", key); if (error) throw fail(error); },
          onSnapshot(fn){ (metaL[key] = metaL[key] || []).push(fn); this.get().then(fn).catch(() => {}); return () => {}; }
        };
      }
    };
    const assets = {
      async upload(blob, opts = {}){
        const type = opts.type || blob.type || "image/png";
        if (blob.size > 20 * 1024 * 1024) throw {code: "too_large"};
        const ext = (type.split("/")[1] || "png").replace("jpeg", "jpg").replace("svg+xml", "svg");
        const path = `${uid}/${crypto.randomUUID()}.${ext}`;
        const {error} = await sb.storage.from("media").upload(path, blob, {contentType: type, cacheControl: "31536000", upsert: false});
        if (error) throw {code: /size|large|exceed/i.test(error.message) ? "too_large" : "upstream_error", message: error.message};
        return {id: path, url: publicUrl(path), sizeBytes: blob.size, contentType: type};
      }
    };
    return {db, assets};
  }

  // ================= вход =================
  function authScreen(msg){
    const el = $("auth"); el.hidden = false; document.body.classList.add("ov-open");
    el.innerHTML = `<div class="au-box"><div class="au-logo">NEXUS</div><p class="au-sub">Твоя полка игр и кино. Войди или создай аккаунт.</p>
      <form id="auF"><label class="f">Почта<input class="in" id="auE" type="email" autocomplete="email" required></label>
        <label class="f">Пароль<input class="in" id="auP" type="password" autocomplete="current-password" minlength="6" required></label>
        <div class="acts"><button class="ib blue" type="submit" id="auIn">Войти</button><button class="ib" type="button" id="auUp">Создать аккаунт</button></div>
        <p class="au-msg" id="auM">${esc(msg || "")}</p></form></div>`;
    const go = async signUp => {
      const email = $("auE").value.trim(), password = $("auP").value;
      if (!email || password.length < 6){ $("auM").textContent = "Почта и пароль от 6 символов"; return; }
      $("auM").textContent = signUp ? "Создаю аккаунт…" : "Вхожу…";
      const r = signUp ? await SB.auth.signUp({email, password}) : await SB.auth.signInWithPassword({email, password});
      if (r.error){ $("auM").textContent = /invalid login/i.test(r.error.message) ? "Неверная почта или пароль" : /already registered/i.test(r.error.message) ? "Такой аккаунт уже есть, жми «Войти»" : r.error.message; return; }
      if (!r.data.session){ $("auM").textContent = "Проверь почту и подтверди адрес, потом войди"; return; }
      el.hidden = true; el.innerHTML = ""; document.body.classList.remove("ov-open");
      start(r.data.session.user);
    };
    $("auF").onsubmit = e => { e.preventDefault(); go(false); };
    $("auUp").onclick = () => go(true);
  }

  async function start(user){
    ME = user;
    const {data: prof} = await SB.from("profiles").select("nick,avatar,ava_animal,ava_color").eq("user_id", user.id).maybeSingle();
    if (prof && prof.nick){ setNick(prof.nick); MEP = prof; } else { await nickSheet(true); MEP = {nick: NICK}; assets = makeBackend(SB, user.id).assets; await avaSheet(true); }
    const be = makeBackend(SB, user.id); db = be.db; assets = be.assets; canWrite = true;
    const timer = setTimeout(() => toast("Данные пока не подгрузились. Проверь интернет."), 12000);
    db.doc("meta/theme").onSnapshot(d => { theme = d.exists ? d.data() : null; applyTheme(theme); });
    Promise.all(["backup", "autobackup"].map(x => db.doc("meta/" + x).get().then(d => d.exists ? d.data() : null).catch(() => null)))
      .then(([b, a]) => { lastBackup = b; autoBackup = a; if (route === "more") render(); });
    loadFriends();
    db.collection("items").onSnapshot(snap => {
      if (!snap.metadata.fromCache){ clearTimeout(timer); itemsLoaded = true; }
      items = snap.docs.map(d => ({id: d.id, ...d.data()}));
      render(); checkAch();
      if (openId && !$("view").hidden && $("heroPoster") && $("ce").hidden && !sheets.length) openItem(openId);
    }, e => { clearTimeout(timer); toast("Не получилось загрузить данные: " + e.message); });
    render();
  }

  // ================= запуск =================
  readHash(); render();
  (async () => {
    if (!CFG.SUPABASE_URL || /ВСТАВЬ|YOUR/i.test(CFG.SUPABASE_URL) || !window.supabase){
      $("sMain").innerHTML = `<div class="s-empty" style="margin-top:20px"><b>Сайт ещё не подключён к базе</b>Открой файл config.js и вставь адрес и ключ проекта Supabase, как написано в инструкции.</div>`;
      return;
    }
    SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
    const {data: {session}} = await SB.auth.getSession();
    if (session) start(session.user); else authScreen();
  })();
})();
</script>
